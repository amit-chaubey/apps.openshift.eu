site_name: apps.openshift.eu
site_description: How to install and configure the Helm charts of the apps.openshift.eu application marketplace
site_url: https://docs.openshift.eu/
repo_url: https://github.com/hoolia/apps.openshift.eu
repo_name: hoolia/apps.openshift.eu
edit_uri: edit/main/docs/
copyright: GRN.CLOUD B.V.
docs_dir: docs
strict: true

# chart, values, changelog and catalog pages are generated at build time
hooks:
- ci/docs_gen.py

theme:
  name: material
  features:
  - navigation.indexes
  - navigation.sections
  - navigation.top
  - search.highlight
  - search.suggest
  - content.code.copy
  - content.action.edit
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: teal
    accent: teal
    toggle:
      icon: material/weather-night
      name: Dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: teal
    accent: teal
    toggle:
      icon: material/weather-sunny
      name: Light mode

plugins:
- search

markdown_extensions:
- admonition
- attr_list
- tables
- toc:
    permalink: true
- pymdownx.highlight
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
- Home: index.md
- Conventions:
  - conventions/index.md
  - MCP catalog labels: conventions/mcp-catalog.md
  - Agent OAuth login: conventions/oauth.md
  - MCP gateway annotations: conventions/mcp-gateway.md
- MCP catalog: mcp-catalog.md
# replaced by ci/docs_gen.py with one entry per chart
- Charts: charts/index.md
