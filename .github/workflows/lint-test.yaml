name: Lint and test charts
on:
  pull_request:
  push:
    branches:
    - main
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    # pinned: "latest" falls back to an old Helm when the release lookup fails
    - uses: azure/setup-helm@v4
      with:
        version: v4.3.1
    - name: Install gitleaks
      run: |
        curl -sSL "$(curl -sSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r '.assets[] | select(.name | test("linux_x64.tar.gz$")) | .browser_download_url')" | sudo tar -xz -C /usr/local/bin gitleaks
    - name: Install PyYAML
      run: sudo apt-get install -y python3-yaml
    - name: Check charts
      run: ci/check.sh
    - name: Test guacamole chart
      run: ci/test-guacamole.sh
    - name: Test opencode-agent chart
      run: ci/test-opencode-agent.sh
    - name: Test agent-identity token proxy
      run: python3 -m unittest images/agent-identity/test_token_proxy.py
    - name: Test opencode-agent UI proxy
      run: python3 -m unittest ci/test_opencode_agent_ui_proxy.py
    - name: Test openwebui chart
      run: ci/test-openwebui.sh
    - name: Test SBOM image collection
      run: python3 -m unittest ci/test_sbom.py
    - name: Scan history for secrets
      run: gitleaks detect --source . --redact
