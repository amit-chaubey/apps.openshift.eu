name: Release charts
on:
  push:
    branches:
    - main
    paths:
    - charts/**
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Configure git
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
    # pinned: "latest" falls back to an old Helm when the release lookup fails
    - uses: azure/setup-helm@v4
      with:
        version: v4.3.1
    - uses: helm/chart-releaser-action@v1
      with:
        charts_dir: charts
      env:
        CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
