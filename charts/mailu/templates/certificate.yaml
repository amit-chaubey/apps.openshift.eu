{{- if .Values.certificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "mailu-wrapper.fullname" . }}-certificates
  labels:
    app: {{ include "mailu-wrapper.fullname" $ | quote }}
    app.kubernetes.io/name: {{ $.Values.upstream.nameOverride | quote }}
    app.kubernetes.io/component: certificate
    {{- include "mailu.commonLabels" $ | nindent 4 }}
spec:
  secretName: {{ include "mailu-wrapper.fullname" . }}-certificates
  commonName: {{ first .Values.upstream.hostnames }}
  dnsNames:
  {{- range .Values.upstream.hostnames }}
  - {{ . }}
  {{- end }}
  issuerRef:
    name: {{ required "certificate.issuerName is required" .Values.certificate.issuerName }}
    kind: {{ .Values.certificate.issuerKind }}
    group: cert-manager.io
  renewBefore: {{ .Values.certificate.renewBefore }}
{{- end }}
