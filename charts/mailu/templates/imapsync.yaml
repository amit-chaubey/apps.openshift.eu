{{- if .Values.imapsync.enabled }}
{{- $name := printf "%s-imapsync" (include "mailu-wrapper.fullname" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-nginx-config
  labels:
    {{- include "mailu-wrapper.labels" (dict "root" $ "component" "migration" "app" $name "name" "imapsync") | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8081;

      location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailu-wrapper.labels" (dict "root" $ "component" "migration" "app" $name "name" "imapsync") | nindent 4 }}
    app.openshift.io/runtime: perl
  annotations:
    app.openshift.io/vcs-uri: https://github.com/imapsync/imapsync
spec:
  replicas: {{ .Values.imapsync.replicaCount }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
      - name: imapsync
        image: "{{ .Values.imapsync.image.repository }}:{{ .Values.imapsync.image.tag }}"
        imagePullPolicy: {{ .Values.imapsync.image.pullPolicy }}
        command:
        - /bin/sh
        - -c
        - /servimapsync
        ports:
        - containerPort: 8080
        resources: {{- toYaml .Values.imapsync.resources | nindent 10 }}
      - name: nginx
        image: "{{ .Values.imapsync.nginx.image.repository }}:{{ .Values.imapsync.nginx.image.tag }}"
        imagePullPolicy: {{ .Values.imapsync.nginx.image.pullPolicy }}
        ports:
        - containerPort: 8081
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: nginx-config
        configMap:
          name: {{ $name }}-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailu-wrapper.labels" (dict "root" $ "component" "migration" "app" $name "name" "imapsync") | nindent 4 }}
spec:
  selector:
    app: {{ $name }}
  ports:
  - name: http
    port: 8080
    targetPort: 8081
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailu-wrapper.labels" (dict "root" $ "component" "migration" "app" $name "name" "imapsync") | nindent 4 }}
spec:
  {{- if .Values.imapsync.route.hostname }}
  host: {{ .Values.imapsync.route.hostname }}
  {{- end }}
  to:
    kind: Service
    name: {{ $name }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailu-wrapper.labels" (dict "root" $ "component" "migration" "app" $name "name" "imapsync") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ $name }}
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 8081
{{- end }}
{{- end }}
