{{- if .Values.networkPolicy.enabled }}
{{- $ports := (include "mailu-wrapper.frontPorts" . | fromYaml).ports }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mailu-wrapper.fullname" . }}-front
  labels:
    {{- include "mailu-wrapper.labels" (dict "root" $ "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "mailu-wrapper.selector" (dict "context" . "component" "front") | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - ports:
    {{- range $ports }}
    - port: {{ .port }}
      protocol: TCP
    {{- end }}
    {{- if and .Values.route.enabled (not .Values.mailService.ports.http) }}
    - port: 80
      protocol: TCP
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mailu-wrapper.fullname" . }}-allow-same-namespace
  labels:
    {{- include "mailu-wrapper.labels" (dict "root" $ "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "mailu-wrapper.selector" (dict "context" .) | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
{{- end }}
