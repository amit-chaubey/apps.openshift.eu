{{- if .Values.egressService.enabled }}
{{- $annotations := deepCopy .Values.egressService.annotations }}
{{- if .Values.dns.enabled }}
{{- $host := include "mailu-wrapper.egressHostname" . }}
{{- $_ := set $annotations "external-dns.alpha.kubernetes.io/hostname" $host }}
{{- $_ := set $annotations "external-dns.kubernetes.io/hostname" $host }}
{{- $_ := set $annotations "external-dns.alpha.kubernetes.io/ttl" (toString .Values.dns.ttl) }}
{{- $_ := set $annotations "external-dns.kubernetes.io/ttl" (toString .Values.dns.ttl) }}
{{- end }}
# never shared: receiving servers judge outgoing mail by this address and its name
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mailu-wrapper.fullname" . }}-postfix-egress
  labels:
    app: {{ include "mailu-wrapper.fullname" $ | quote }}
    app.kubernetes.io/name: {{ $.Values.upstream.nameOverride | quote }}
    app.kubernetes.io/component: mail
    {{- include "mailu.commonLabels" $ | nindent 4 }}
  {{- with $annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: {{- include "mailu-wrapper.selector" (dict "context" . "component" "postfix") | nindent 4 }}
  ports:
  # a Service needs a port; nothing listens on it
  - name: egress-only
    port: 9
    targetPort: 9
    protocol: TCP
{{- end }}
