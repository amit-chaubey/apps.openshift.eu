{{- if .Values.egressService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mailu-wrapper.fullname" . }}-postfix-egress
  labels:
    {{- include "mailu-wrapper.labels" (dict "root" $ "component" "mail") | nindent 4 }}
  {{- with merge (deepCopy .Values.egressService.annotations) (include "mailu-wrapper.publicAddress" . | fromYaml) }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: {{ include "mailu-wrapper.trafficPolicy" (dict "root" . "policy" "Local") }}
  selector: {{- include "mailu-wrapper.selector" (dict "context" . "component" "postfix") | nindent 4 }}
  ports:
  # a Service needs a port; nothing listens on it
  - name: egress-only
    port: 9
    targetPort: 9
    protocol: TCP
{{- end }}
