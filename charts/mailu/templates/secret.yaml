{{- if eq .Values.secrets.type "kubernetes" }}
{{- $name := include "mailu-wrapper.secretName" . }}
{{- $found := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existing := dict }}
{{- if $found }}{{- $existing = $found.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app: {{ include "mailu-wrapper.fullname" $ | quote }}
    app.kubernetes.io/name: {{ $.Values.upstream.nameOverride | quote }}
    app.kubernetes.io/component: credentials
    {{- include "mailu.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  secret-key: {{ include "mailu-wrapper.secretValue" (dict "value" .Values.secrets.secretKey "existing" $existing "key" "secret-key" "length" 32) | quote }}
  initial-account-password: {{ include "mailu-wrapper.secretValue" (dict "value" .Values.secrets.initialAdminPassword "existing" $existing "key" "initial-account-password" "length" 20) | quote }}
  api-token: {{ include "mailu-wrapper.secretValue" (dict "value" .Values.secrets.apiToken "existing" $existing "key" "api-token" "length" 32) | quote }}
  roundcube-db-password: {{ include "mailu-wrapper.secretValue" (dict "value" .Values.secrets.roundcubeKey "existing" $existing "key" "roundcube-db-password" "length" 32) | quote }}
{{- end }}
