apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mailu-wrapper.fullname" . }}-front-dovecot
  labels:
    app: {{ include "mailu-wrapper.fullname" $ | quote }}
    app.kubernetes.io/name: {{ $.Values.upstream.nameOverride | quote }}
    app.kubernetes.io/component: config
    {{- include "mailu.commonLabels" $ | nindent 4 }}
data:
  # no chroot: the pod has no SYS_CHROOT capability
  proxy.conf: |
    service imap-login {
      chroot =
    }
    service pop3-login {
      chroot =
    }
    service managesieve-login {
      chroot =
    }
    service submission-login {
      chroot =
    }
    service anvil {
      chroot =
    }
    service ipc {
      chroot =
    }
    # a client inside the cluster (upstream.subnet), such as the Mail app of Nextcloud on the
    # webmail ports, may log in without TLS, as Mailu's own containers do
    {{- range splitList "," (.Values.upstream.subnet | default "") }}
    {{- with trim . }}
    remote {{ . }} {
      ssl = yes
      disable_plaintext_auth = no
    }
    {{- end }}
    {{- end }}
