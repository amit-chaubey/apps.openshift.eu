{{- $type := ternary "LoadBalancer" .Values.mailService.type .Values.mailService.public }}
{{- $ports := (include "mailu-wrapper.frontPorts" . | fromYaml).ports }}
{{- $annotations := deepCopy .Values.mailService.annotations }}
{{- if eq $type "LoadBalancer" }}
{{- $annotations = merge $annotations (include "mailu-wrapper.publicAddress" . | fromYaml) }}
{{- if .Values.dns.enabled }}
{{- $_ := set $annotations "external-dns.alpha.kubernetes.io/hostname" (first .Values.upstream.hostnames) }}
{{- $_ := set $annotations "external-dns.kubernetes.io/hostname" (first .Values.upstream.hostnames) }}
{{- $_ := set $annotations "external-dns.alpha.kubernetes.io/ttl" (toString .Values.dns.ttl) }}
{{- $_ := set $annotations "external-dns.kubernetes.io/ttl" (toString .Values.dns.ttl) }}
{{- end }}
{{- end }}
{{- if not .Values.certificate.enabled }}
{{- $_ := set $annotations "service.beta.openshift.io/serving-cert-secret-name" (printf "%s-certificates" (include "mailu-wrapper.fullname" .)) }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mailu-wrapper.fullname" . }}-front-ext
  labels:
    app: {{ include "mailu-wrapper.fullname" $ | quote }}
    app.kubernetes.io/name: {{ $.Values.upstream.nameOverride | quote }}
    app.kubernetes.io/component: mail
    {{- include "mailu.commonLabels" $ | nindent 4 }}
  {{- with $annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $type }}
  {{- if ne $type "ClusterIP" }}
  # never shared: behind a shared address every sender has the address of a node
  externalTrafficPolicy: {{ .Values.mailService.externalTrafficPolicy }}
  {{- end }}
  selector: {{- include "mailu-wrapper.selector" (dict "context" . "component" "front") | nindent 4 }}
  ports:
  {{- range $ports }}
  - name: {{ .name }}
    port: {{ .port }}
    protocol: TCP
  {{- end }}
