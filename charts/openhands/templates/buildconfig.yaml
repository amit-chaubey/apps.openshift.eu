{{- if .Values.build.enabled }}
{{- $name := include "openhands.name" . }}
{{- $build := include "openhands.buildName" . }}
{{- if ne .Values.build.output.kind "DockerImage" }}
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: {{ $name }}
  namespace: {{ include "openhands.namespace" . }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
    app.kubernetes.io/component: build
  annotations:
    # before the build, which pushes into it
    argocd.argoproj.io/sync-wave: "-2"
spec:
  lookupPolicy:
    local: true
---
{{- end }}
# build context of the Containerfile, one per image tag
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $build }}
  namespace: {{ include "openhands.namespace" . }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
    app.kubernetes.io/component: build
  annotations:
    # before the build-wait Job
    argocd.argoproj.io/sync-wave: "-2"
data:
  install-tools.sh: |
{{ .Files.Get "files/install-tools.sh" | indent 4 }}
  verify-tools.sh: |
{{ .Files.Get "files/verify-tools.sh" | indent 4 }}
  tools.txt: |
{{ include "openhands.toolsTxt" . | indent 4 }}
  checks.txt: |
{{ include "openhands.checksTxt" . | indent 4 }}
  mcp_oauth_redirect.py: |
{{ .Files.Get "files/mcp_oauth_redirect.py" | indent 4 }}
  patch-mcp-icons.py: |
{{ .Files.Get "files/patch-mcp-icons.py" | indent 4 }}
  patch-acp-usage.py: |
{{ .Files.Get "files/patch-acp-usage.py" | indent 4 }}
---
# a new image tag is a new BuildConfig, which ConfigChange builds once
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: {{ $build }}
  namespace: {{ include "openhands.namespace" . }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
    app.kubernetes.io/component: build
  annotations:
    # before the build-wait Job
    argocd.argoproj.io/sync-wave: "-2"
spec:
  runPolicy: Serial
  source:
    type: Dockerfile
    dockerfile: |
      {{- include "openhands.containerfile" . | nindent 6 }}
    configMaps:
    - configMap:
        name: {{ $build }}
  strategy:
    type: Docker
    dockerStrategy:
      {{- with .Values.build.pullSecret }}
      pullSecret:
        name: {{ . }}
      {{- end }}
      env:
      - name: BUILD_LOGLEVEL
        value: "0"
  output:
    {{- if eq .Values.build.output.kind "DockerImage" }}
    to:
      kind: DockerImage
      name: {{ include "openhands.image" . }}
    {{- with .Values.build.output.pushSecret }}
    pushSecret:
      name: {{ . }}
    {{- end }}
    {{- else }}
    to:
      kind: ImageStreamTag
      name: {{ $name }}:{{ include "openhands.imageTag" . }}
    {{- end }}
  {{- with .Values.build.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  triggers:
  - type: ConfigChange
  resources:
    {{- toYaml .Values.build.resources | nindent 4 }}
{{- if .Values.build.wait.enabled }}
---
# the build-wait Job reads builds of the namespace and nothing else
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-build-wait
  namespace: {{ include "openhands.namespace" . }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
    app.kubernetes.io/component: build
  annotations:
    # before the build-wait Job
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-build-wait
  namespace: {{ include "openhands.namespace" . }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
    app.kubernetes.io/component: build
  annotations:
    # before the build-wait Job
    argocd.argoproj.io/sync-wave: "-2"
rules:
- apiGroups:
  - build.openshift.io
  resources:
  - builds
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-build-wait
  namespace: {{ include "openhands.namespace" . }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
    app.kubernetes.io/component: build
  annotations:
    # before the build-wait Job
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-build-wait
subjects:
- kind: ServiceAccount
  name: {{ $name }}-build-wait
  namespace: {{ include "openhands.namespace" . }}
---
# Argo CD changes the StatefulSet (wave 0) only after the image of this tag is built:
# until then the pod keeps running the previous image
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-wait" $build | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "openhands.namespace" . }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
    app.kubernetes.io/component: build
  annotations:
    argocd.argoproj.io/hook: Sync
    # a failed Job stays until the next sync, for its log
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    # after the BuildConfig, before the StatefulSet
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ int .Values.build.wait.timeoutSeconds }}
  template:
    metadata:
      labels:
        app: {{ $name }}-build-wait
        app.kubernetes.io/name: openhands
    spec:
      serviceAccountName: {{ $name }}-build-wait
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: wait
        image: {{ .Values.tokenProxy.image }}
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - -c
        - |
          {{- .Files.Get "files/wait-build.py" | nindent 10 }}
        env:
        - name: BUILD_CONFIG
          value: {{ $build }}
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        securityContext:
          {{- include "openhands.containerSecurityContext" . | nindent 10 }}
{{- end }}
{{- end }}
