apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openhands.name" . }}-scripts
  namespace: {{ include "openhands.namespace" . }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  # the owner's OpenShift user name only
  emails.txt: |
    {{- with .Values.oauth.ownerEmail }}
    {{ . }}
    {{- end }}
  seed-settings.py: |
{{ .Files.Get "files/seed-settings.py" | indent 4 }}
  seed-home.sh: |
{{ .Files.Get "files/seed-home.sh" | indent 4 }}
  token-proxy.py: |
{{ .Files.Get "files/token-proxy.py" | indent 4 }}
  mcp-sync.py: |
{{ .Files.Get "files/mcp-sync.py" | indent 4 }}
  a2a-shim.py: |
{{ .Files.Get "files/a2a-shim.py" | indent 4 }}
  a2a-relay.py: |
{{ .Files.Get "files/a2a-relay.py" | indent 4 }}
  kubernetes-mcp-server.toml: |
    denied_resources = [
    {{- range .Values.kubernetesMcpServer.deniedResources }}
      {group = {{ .group | quote }}, version = {{ .version | quote }}, kind = {{ .kind | quote }}},
    {{- end }}
    ]
