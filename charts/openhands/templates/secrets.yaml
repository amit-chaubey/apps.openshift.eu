{{- $name := include "openhands.name" . }}
{{- $ext := eq .Values.secrets.type "externalSecret" }}
{{- $items := .Values.secrets.externalSecret.items }}
{{- $cookie := .Values.secrets.cookieSecret }}
{{- /* oauth-proxy accepts a cookie secret of 16, 24 or 32 bytes only */}}
{{- if and $cookie (not (has (len $cookie) (list 16 24 32))) }}
{{- $cookie = $cookie | sha256sum | trunc 32 }}
{{- end }}
{{- $all := list
  (dict "suffix" "session-api-key" "value" .Values.secrets.sessionApiKey "item" $items.sessionApiKey "length" 48 "generate" true)
  (dict "suffix" "secret-key" "value" .Values.secrets.secretKey "item" $items.secretKey "length" 64 "generate" true)
  (dict "suffix" "cookie-secret" "value" $cookie "item" $items.cookieSecret "length" 32 "generate" true)
}}
{{- if .Values.git.host }}
{{- $all = append $all (dict "suffix" "git-token" "value" .Values.secrets.gitToken "item" $items.gitToken "length" 0 "generate" false) }}
{{- end }}
{{- range $i, $s := $all }}
{{- $secret := printf "%s-%s" $name $s.suffix }}
{{- if $i }}
---
{{- end }}
{{- if and $ext (or $s.item (not $s.generate)) }}
{{- $store := required "secrets.externalSecret.storeName is required" $.Values.secrets.externalSecret.storeName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret }}
  namespace: {{ include "openhands.namespace" $ }}
  labels:
    {{- include "openhands.labels" $ | nindent 4 }}
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: {{ $.Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.secrets.externalSecret.storeKind }}
    name: {{ $store }}
  # ESO defaults, spelled out so a GitOps tool sees no drift
  target:
    name: {{ $secret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: value
    remoteRef:
      key: {{ default $secret $s.item }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- else }}
{{- $existing := include "openhands.existing" (dict "root" $ "name" $secret) | fromJson }}
{{- $value := $s.value }}
{{- if $s.generate }}
{{- $value = include "openhands.secretValue" (dict "value" $s.value "existing" $existing "key" "value" "length" $s.length) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ include "openhands.namespace" $ }}
  labels:
    {{- include "openhands.labels" $ | nindent 4 }}
    app.kubernetes.io/component: credentials
type: Opaque
data:
  value: {{ $value | b64enc | quote }}
{{- end }}
{{- end }}
