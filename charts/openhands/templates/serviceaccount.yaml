apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openhands.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
    {{- with .Values.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    # OAuth client of the UI login; the redirect goes to the Route
    serviceaccounts.openshift.io/oauth-redirectreference.primary: {{ include "openhands.redirectReference" . | quote }}
