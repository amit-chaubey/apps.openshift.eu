apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omniroute.fullname" . }}-redis
  labels:
    app: {{ printf "%s-redis" (include "omniroute.fullname" $) | quote }}
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    {{- include "omniroute.commonLabels" $ | nindent 4 }}
    app.openshift.io/runtime: redis
  annotations:
    app.openshift.io/vcs-uri: https://github.com/redis/redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "omniroute.fullname" . }}-redis
  template:
    metadata:
      labels:
        app: {{ include "omniroute.fullname" . }}-redis
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "omniroute.fullname" . }}-redis
      containers:
      - name: redis
        image: {{ .Values.redis.image }}
        command:
        - redis-server
        - --save
        - "60"
        - "1"
        - --loglevel
        - warning
        ports:
        - containerPort: 6379
          name: redis
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          {{- toYaml .Values.redis.resources | nindent 10 }}
