apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "omniroute.fullname" . }}-redis
  labels:
    app: {{ printf "%s-redis" (include "omniroute.fullname" $) | quote }}
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    {{- include "omniroute.commonLabels" $ | nindent 4 }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size }}
{{- if .Values.redis.persistence.storageClassName }}
  storageClassName: {{ .Values.redis.persistence.storageClassName }}
{{- end }}
