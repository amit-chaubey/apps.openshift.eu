apiVersion: v1
kind: Service
metadata:
  name: {{ include "omniroute.fullname" . }}
  labels:
    app: {{ include "omniroute.fullname" $ | quote }}
    app.kubernetes.io/name: omniroute
    app.kubernetes.io/component: server
    {{- include "omniroute.commonLabels" $ | nindent 4 }}
spec:
  selector:
    app: {{ include "omniroute.fullname" . }}
  ports:
  - name: http
    port: 20128
    targetPort: http
