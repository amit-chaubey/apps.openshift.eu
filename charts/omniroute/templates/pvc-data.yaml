apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "omniroute.fullname" . }}-data
  labels:
    {{- include "omniroute.labels" (dict "root" $ "component" "storage") | nindent 4 }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName }}
{{- end }}
