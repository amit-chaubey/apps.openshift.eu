{{- if eq .Values.secrets.type "kubernetes" }}
{{- $name := printf "%s-secret" (include "omniroute.fullname" .) }}
{{- $found := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existing := dict }}
{{- if $found }}{{- $existing = $found.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app: {{ include "omniroute.fullname" $ | quote }}
    app.kubernetes.io/name: omniroute
    app.kubernetes.io/component: credentials
    {{- include "omniroute.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ include "omniroute.secretValue" (dict "value" .Values.secrets.jwtSecret "existing" $existing "key" "JWT_SECRET" "length" 64) | quote }}
  API_KEY_SECRET: {{ include "omniroute.secretValue" (dict "value" .Values.secrets.apiKeySecret "existing" $existing "key" "API_KEY_SECRET" "hex" true) | quote }}
  INITIAL_PASSWORD: {{ include "omniroute.secretValue" (dict "value" .Values.secrets.initialPassword "existing" $existing "key" "INITIAL_PASSWORD" "length" 24) | quote }}
  STORAGE_ENCRYPTION_KEY: {{ include "omniroute.secretValue" (dict "value" .Values.secrets.storageEncryptionKey "existing" $existing "key" "STORAGE_ENCRYPTION_KEY" "hex" true) | quote }}
{{- end }}
