route:
  # empty: OpenShift assigns a host under the default application domain
  hostname: ""
  # used when a hostname is set; certificate issued by cert-manager
  annotations:
    cert-manager.io/issuer-kind: ClusterIssuer
    cert-manager.io/issuer-name: letsencrypt
    # long streaming answers
    haproxy.router.openshift.io/timeout: 600s

secrets:
  # kubernetes: Secret from the values below. externalSecret: from a secret store
  type: kubernetes
  adminUsername: admin
  # password of the dashboard; empty: generated
  adminPassword: ""
  # key that encrypts stored provider keys; empty: generated once and kept
  encryptionKey: ""
  externalSecret:
    storeKind: ClusterSecretStore
    storeName: ""
    refreshInterval: 1h
    # vault item per key; the value is read from the item's password
    items:
      password: bifrost-admin
      encryption-key: bifrost-encryption-key

# Values of the upstream chart bifrost, included under the alias upstream
upstream:
  nameOverride: bifrost
  fullnameOverride: bifrost
  # topology view of the console; on the workload only, not on its pods
  deploymentLabels:
    app: bifrost
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: bifrost
    app.openshift.io/runtime: golang
  deploymentAnnotations:
    app.openshift.io/vcs-uri: https://github.com/maximhq/bifrost
  image:
    tag: v1.5.8
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi
  bifrost:
    encryptionKeySecret:
      name: bifrost-credentials
      key: encryption-key
    authConfig:
      isEnabled: true
      existingSecret: bifrost-credentials
      usernameKey: username
      passwordKey: password
  storage:
    mode: sqlite
    persistence:
      enabled: true
      size: 10Gi
