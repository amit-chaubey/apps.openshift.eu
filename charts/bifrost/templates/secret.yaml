{{- if eq .Values.secrets.type "kubernetes" }}
{{- $found := lookup "v1" "Secret" .Release.Namespace "bifrost-credentials" }}
{{- $existing := dict }}
{{- if $found }}{{- $existing = $found.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: bifrost-credentials
  labels:
    app: bifrost
    app.kubernetes.io/name: bifrost
    app.kubernetes.io/component: credentials
    {{- include "bifrost.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.secrets.adminUsername | b64enc | quote }}
  {{- if .Values.secrets.adminPassword }}
  password: {{ .Values.secrets.adminPassword | b64enc | quote }}
  {{- else if hasKey $existing "password" }}
  password: {{ index $existing "password" | quote }}
  {{- else }}
  password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.encryptionKey }}
  encryption-key: {{ .Values.secrets.encryptionKey | b64enc | quote }}
  {{- else if hasKey $existing "encryption-key" }}
  encryption-key: {{ index $existing "encryption-key" | quote }}
  {{- else }}
  encryption-key: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- else }}
{{- $es := .Values.secrets.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bifrost-credentials
  labels:
    app: bifrost
    app.kubernetes.io/name: bifrost
    app.kubernetes.io/component: credentials
    {{- include "bifrost.commonLabels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ required "secrets.externalSecret.storeName is required" $es.storeName }}
  target:
    name: bifrost-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        username: {{ .Values.secrets.adminUsername | quote }}
  data:
  {{- range $key, $item := $es.items }}
  - secretKey: {{ $key }}
    remoteRef:
      key: {{ $item }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  {{- end }}
{{- end }}
