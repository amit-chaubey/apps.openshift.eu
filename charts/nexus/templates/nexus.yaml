apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-data
  labels:
    app: nexus
    app.kubernetes.io/name: nexus
    app.kubernetes.io/component: storage
    {{- include "nexus.commonLabels" $ | nindent 4 }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
  labels:
    app: nexus
    app.kubernetes.io/name: nexus
    app.kubernetes.io/component: server
    {{- include "nexus.commonLabels" $ | nindent 4 }}
    app.openshift.io/runtime: java
  annotations:
    app.openshift.io/vcs-uri: https://github.com/sonatype/nexus-public
spec:
  replicas: 1
  # the data volume is ReadWriteOnce: the old pod must release it first
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus
    spec:
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nexus
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        ports:
        - name: http
          containerPort: 8081
        env:
        - name: INSTALL4J_ADD_VM_PARAMS
          value: >-
            -Xms{{ .Values.jvm.heap }} -Xmx{{ .Values.jvm.heap }}
            -XX:MaxDirectMemorySize={{ .Values.jvm.directMemory }}
            -Djava.util.prefs.userRoot=/nexus-data/javaprefs
        - name: NEXUS_SECURITY_INITIAL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nexus-credentials
              key: admin-password
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /nexus-data
        startupProbe:
          httpGet:
            path: /service/rest/v1/status
            port: http
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /service/rest/v1/status
            port: http
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /service/rest/v1/status
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: nexus-data
---
apiVersion: v1
kind: Service
metadata:
  name: nexus
  labels:
    app: nexus
    app.kubernetes.io/name: nexus
    app.kubernetes.io/component: server
    {{- include "nexus.commonLabels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: nexus
  ports:
  - name: http
    port: 8081
    targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nexus
  labels:
    app: nexus
    app.kubernetes.io/name: nexus
    app.kubernetes.io/component: route
    {{- include "nexus.commonLabels" $ | nindent 4 }}
  {{- if and .Values.route.hostname .Values.route.annotations }}
  annotations:
    {{- toYaml .Values.route.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.route.hostname }}
  host: {{ .Values.route.hostname }}
  {{- end }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: nexus
    weight: 100
  wildcardPolicy: None
