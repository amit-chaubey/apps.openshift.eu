{{- if eq .Values.secrets.type "kubernetes" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qdrant.name" . }}-api-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qdrant.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
type: Opaque
data:
  api-key: {{ include "qdrant.apiKey" . | b64enc | quote }}
{{- end }}
