apiVersion: v1
kind: Service
metadata:
  name: {{ include "qdrant.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qdrant.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  ports:
  - name: http
    port: 6333
    targetPort: http
  - name: grpc
    port: 6334
    targetPort: grpc
  selector:
    {{- include "qdrant.selectorLabels" . | nindent 4 }}
