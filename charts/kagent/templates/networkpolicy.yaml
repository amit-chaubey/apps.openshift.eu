{{- if .Values.networkPolicy.enabled }}
{{- $fullname := .Values.upstream.fullnameOverride }}
# The controller API trusts its callers (auth mode unsecure): nothing outside the
# release namespace reaches a pod unless a policy below admits it
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-default-deny-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: network
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# Controller, agents, database and the login proxy talk to each other; the UI
# only takes the login proxy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-same-namespace
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: network
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/component
      operator: NotIn
      values:
      - ui
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: network
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.upstream.nameOverride }}
      app.kubernetes.io/component: ui
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "tenant.frontSelectorLabels" . | nindent 10 }}
---
# The login proxy (OpenShift or oauth2-proxy) only from the router
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tenant.login" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: network
spec:
  podSelector:
    matchLabels:
      {{- include "tenant.frontSelectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: {{ include "tenant.frontPort" . }}
    from:
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/ingress: ""
    # a HostNetwork router sends from the node network
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/host-network: ""
{{- with .Values.networkPolicy.agentNamespaceSelector }}
---
# Agent pods of the team namespaces store sessions and call agents through the controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-agents
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
    app.kubernetes.io/component: network
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $.Values.upstream.nameOverride }}
      app.kubernetes.io/component: controller
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- end }}
