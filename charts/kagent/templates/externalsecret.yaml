{{- if and (eq .Values.login.provider "oidc") (eq .Values.secrets.type "externalSecret") }}
{{- $es := .Values.secrets.externalSecret }}
# upstream.oauth2-proxy.config.existingSecret: client id, client secret and cookie key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "tenant.oidcSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ required "secrets.externalSecret.storeName is required" $es.storeName }}
  target:
    name: {{ include "tenant.oidcSecret" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        client-id: {{ required "login.oidc.clientId is required" .Values.login.oidc.clientId | quote }}
        client-secret: {{ "{{ .clientSecret }}" | quote }}
        cookie-secret: {{ "{{ .cookieSecret }}" | quote }}
  data:
  - secretKey: clientSecret
    remoteRef:
      key: {{ required "secrets.externalSecret.items.oidcClientSecret is required" $es.items.oidcClientSecret }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  - secretKey: cookieSecret
    remoteRef:
      key: {{ required "secrets.externalSecret.items.oidcCookieSecret is required" $es.items.oidcCookieSecret }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- end }}
