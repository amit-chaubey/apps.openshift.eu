{{- if eq .Values.login.provider "openshift" }}
{{- $name := include "tenant.login" . }}
{{- $found := lookup "v1" "Secret" .Release.Namespace (printf "%s-cookie-secret" $name) }}
{{- $existing := ternary (default dict $found.data) dict (not (empty $found)) }}
{{- /* oauth-proxy accepts 16, 24 or 32 bytes: a value of another length is hashed to 32 */}}
{{- $cookie := .Values.secrets.cookieSecret }}
{{- if and $cookie (not (has (len $cookie) (list 16 24 32))) }}
{{- $cookie = $cookie | sha256sum | trunc 32 }}
{{- end }}
# Login cookie key, generated once and kept on upgrade
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-cookie-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
type: Opaque
data:
  cookie-secret: {{ include "tenant.secretValue" (dict "value" $cookie "existing" $existing "key" "cookie-secret" "length" 32) | b64enc | quote }}
{{- end }}
