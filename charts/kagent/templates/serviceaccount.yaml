{{- include "tenant.validate" . }}
{{- if eq .Values.login.provider "openshift" }}
# OAuth client of the login
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tenant.login" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: login
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: {{ include "tenant.redirectReference" . | quote }}
{{- end }}
