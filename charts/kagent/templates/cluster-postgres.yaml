{{- if .Values.database.cnpg.enabled }}
{{- $c := .Values.database.cnpg }}
# The controller's database; upstream.database.postgres.urlFile reads the uri key of
# the generated Secret <name>-app
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "tenant.postgres" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  instances: {{ $c.instances }}
  {{- with $c.imageName }}
  imageName: {{ . }}
  {{- end }}
  # a single instance with a PDB would block every node drain
  enablePDB: {{ gt (int $c.instances) 1 }}
  bootstrap:
    initdb:
      database: kagent
      owner: kagent
  storage:
    size: {{ $c.storage.size }}
    {{- with $c.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  {{- with $c.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
