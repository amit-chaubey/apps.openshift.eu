{{- if .Values.examples.enabled }}
{{- $t := .Values.examples.tools }}
{{- $name := "kagent-example-tools" }}
# Tool server of the upstream example agents (upstream.<agent>.enabled), which call
# RemoteMCPServer kagent-tool-server; it reads the release namespace only
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: example-tools
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: example-tools
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $t.clusterRole }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: example-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: example-tools
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kagent
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: example-tools
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: tools
        image: {{ $t.image }}
        command:
        - /tool-server
        args:
        - --port
        - "8084"
        - --metrics-port
        - "8085"
        {{- range $t.args }}
        - {{ . | quote }}
        {{- end }}
        env:
        - name: KAGENT_NAMESPACE
          value: {{ .Release.Namespace }}
        - name: OTEL_TRACING_ENABLED
          value: "false"
        ports:
        - name: http-tools
          containerPort: 8084
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: http-tools
          initialDelaySeconds: 5
          periodSeconds: 15
        resources:
          {{- toYaml $t.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: example-tools
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: example-tools
  ports:
  - name: mcp
    port: 8084
    targetPort: http-tools
    protocol: TCP
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: kagent-tool-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: example-tools
spec:
  description: Kubernetes tools of the example agents; they read this namespace only
  protocol: STREAMABLE_HTTP
  url: http://{{ $name }}.{{ .Release.Namespace }}:8084/mcp
  timeout: 30s
  sseReadTimeout: 5m0s
  terminateOnClose: true
  allowedNamespaces:
    from: Same
{{- end }}
