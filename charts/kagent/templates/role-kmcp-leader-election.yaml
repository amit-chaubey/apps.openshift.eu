{{- if dig "kmcp" "enabled" false .Values.upstream }}
{{- $mcp := dig "kmcp" "fullnameOverride" "" .Values.upstream | default (printf "%s-kmcp" .Release.Name) }}
# Upstream kmcp leader election; kmcp.rbac.create is false, the platform grants the rest
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $mcp }}-leader-election-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
rules:
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $mcp }}-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $mcp }}-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ $mcp }}-controller-manager
  namespace: {{ .Release.Namespace }}
{{- end }}
