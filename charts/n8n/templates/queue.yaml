{{- if .Values.queue.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-worker
  labels:
    app: n8n-worker
    app.kubernetes.io/name: n8n-worker
    app.kubernetes.io/component: worker
    {{- include "n8n.commonLabels" $ | nindent 4 }}
    app.openshift.io/runtime: nodejs
  annotations:
    app.openshift.io/vcs-uri: https://github.com/n8n-io/n8n
    app.openshift.io/connects-to: '[{"apiVersion":"postgresql.cnpg.io/v1","kind":"Cluster","name":"n8n-db"},{"apiVersion":"apps/v1","kind":"Deployment","name":"n8n-redis"}]'
spec:
  replicas: {{ .Values.queue.workers }}
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n-worker
      annotations:
        checksum/scripts: {{ include (print $.Template.BasePath "/route-host.yaml") (merge (dict "checksum" true) .) | sha256sum }}
    spec:
      {{- include "wrapper.podSpec" . | nindent 6 }}
      containers:
      - name: worker
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        command: ["tini", "--", "/bin/sh", "/scripts/start.sh"]
        args: ["worker", "--concurrency={{ .Values.queue.concurrency }}"]
        ports:
        - name: http
          containerPort: 5678
        env:
        {{- include "wrapper.env" . | nindent 8 }}
        securityContext:
          {{- include "wrapper.restricted" . | nindent 10 }}
        volumeMounts:
        - name: home
          mountPath: /home/node
        - name: scripts
          mountPath: /scripts
        - name: db-ca
          mountPath: /db-ca
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          {{- toYaml .Values.queue.resources | nindent 10 }}
      volumes:
      - name: home
        emptyDir: {}
      {{- include "wrapper.volumes" . | nindent 6 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-redis
  labels:
    app: n8n-redis
    app.kubernetes.io/name: n8n-redis
    app.kubernetes.io/component: queue
    {{- include "n8n.commonLabels" $ | nindent 4 }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
{{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-redis
  labels:
    app: n8n-redis
    app.kubernetes.io/name: n8n-redis
    app.kubernetes.io/component: queue
    {{- include "n8n.commonLabels" $ | nindent 4 }}
    app.openshift.io/runtime: redis
  annotations:
    app.openshift.io/vcs-uri: https://github.com/valkey-io/valkey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n-redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: {{ .Values.queue.redis.image }}
        command:
        - sh
        - -c
        - exec valkey-server --requirepass "$REDIS_PASSWORD" --appendonly yes --dir /data
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-credentials
              key: redis-password
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: n8n-credentials
              key: redis-password
        ports:
        - name: redis
          containerPort: 6379
        readinessProbe:
          exec:
            command: [valkey-cli, ping]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: [valkey-cli, ping]
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 5
        resources:
          {{- toYaml .Values.queue.redis.resources | nindent 10 }}
        securityContext:
          {{- include "wrapper.restricted" . | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: n8n-redis
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-redis
  labels:
    app: n8n-redis
    app.kubernetes.io/name: n8n-redis
    app.kubernetes.io/component: queue
    {{- include "n8n.commonLabels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: n8n-redis
  ports:
  - name: redis
    port: 6379
    targetPort: redis
{{- end }}
