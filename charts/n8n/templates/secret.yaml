{{- if eq .Values.secrets.type "kubernetes" }}
{{- $found := lookup "v1" "Secret" .Release.Namespace "n8n-credentials" }}
{{- $existing := dict }}
{{- if $found }}{{- $existing = $found.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: n8n-credentials
  labels:
    {{- include "wrapper.labels" (dict "root" $ "component" "credentials") | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.encryptionKey }}
  encryption-key: {{ .Values.secrets.encryptionKey | b64enc | quote }}
  {{- else if hasKey $existing "encryption-key" }}
  encryption-key: {{ index $existing "encryption-key" | quote }}
  {{- else }}
  encryption-key: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.redisPassword }}
  redis-password: {{ .Values.secrets.redisPassword | b64enc | quote }}
  {{- else if hasKey $existing "redis-password" }}
  redis-password: {{ index $existing "redis-password" | quote }}
  {{- else }}
  redis-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- else }}
{{- $es := .Values.secrets.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-credentials
  labels:
    {{- include "wrapper.labels" (dict "root" $ "component" "credentials") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ required "secrets.externalSecret.storeName is required" $es.storeName }}
  target:
    name: n8n-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  {{- range $key, $item := $es.items }}
  {{- if or (ne $key "redis-password") $.Values.queue.enabled }}
  - secretKey: {{ $key }}
    remoteRef:
      key: {{ $item }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  {{- end }}
  {{- end }}
{{- end }}
