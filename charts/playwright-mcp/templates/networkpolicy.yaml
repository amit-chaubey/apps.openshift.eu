{{- if .Values.networkPolicy.enabled }}
# Callers: the own project and the listed namespaces (an MCP gateway)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "playwright-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  podSelector:
    matchLabels:
      {{- include "playwright-mcp.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  {{- if .Values.networkPolicy.egress.enabled }}
  - Egress
  {{- end }}
  ingress:
  - ports:
    - protocol: TCP
      port: {{ .Values.port }}
    from:
    - podSelector: {}
    {{- range .Values.networkPolicy.ingressNamespaces }}
    - namespaceSelector:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  {{- with .Values.networkPolicy.egress }}
  {{- if .enabled }}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .dnsNamespace }}
    ports:
    - protocol: UDP
      port: {{ .dnsPort }}
    - protocol: TCP
      port: {{ .dnsPort }}
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        {{- range concat .exceptCidrs .extraExceptCidrs }}
        - {{ . }}
        {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
