{{- if and .Values.enabled .Values.auth.enabled .Values.auth.issuerUrl }}
# Protected resource metadata (RFC 9728) of the token check: the issuer of the tokens it takes
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-officeagent.name" . }}-auth
  namespace: {{ include "mcp-officeagent.namespace" . }}
  labels:
    app: {{ include "mcp-officeagent.name" . }}
    app.kubernetes.io/name: mcp-officeagent
    app.kubernetes.io/component: server
    {{- include "mcp-officeagent.commonLabels" . | nindent 4 }}
data:
  {{- include "mcp-auth.metadataData" (dict "root" . "name" (include "mcp-officeagent.name" .) "namespace" (include "mcp-officeagent.namespace" .) "port" .Values.port "path" "/") | nindent 2 }}
{{- end }}
