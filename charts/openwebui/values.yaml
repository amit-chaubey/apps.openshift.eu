# Team of the tenant the app serves: the chart puts every object into <tenant>-<team>, a
# namespace the team already has. Empty: the release namespace
team: ""
# Tenant the app belongs to; required with team
tenant: ""

person:
  # short lowercase name; objects are named <name>-openwebui. Empty: the release name
  name: ""
  # OpenShift user name (an email) of the owner, who logs in and becomes admin
  email: ""

route:
  # empty: OpenShift assigns a host under the default application domain
  host: ""
  # extra labels on the Route only, for example to pick a router shard
  labels: {}
  # answers stream; the router must not cut long requests
  timeout: 3600s
  # used when a host is set; certificate issued by cert-manager
  annotations:
    cert-manager.io/issuer-kind: ClusterIssuer
    cert-manager.io/issuer-name: letsencrypt

oauth:
  # OpenShift user name (an email) of the only person admitted. Empty: person.email;
  # both empty: everyone who may edit the project
  ownerEmail: ""
  # OpenShift groups admitted, strictly (with an owner: the owner must be in one)
  allowedGroups: []
  # ClusterRole holding the verb login on services/proxy that allowedGroups are bound
  # to. Empty: the chart's own Role, which only an installer holding that verb (a
  # cluster admin) can create
  loginClusterRole: ""

secrets:
  # kubernetes: Secrets from the values below. externalSecret: from a secret store
  type: kubernetes
  # login cookie key. Empty: generated once and kept on upgrade. A value that is
  # not 16, 24 or 32 characters long is hashed to 32
  cookieSecret: ""
  # Open WebUI session signing key (WEBUI_SECRET_KEY). Empty: generated once
  secretKey: ""
  externalSecret:
    storeKind: ClusterSecretStore
    storeName: ""
    refreshInterval: 1h
    # one vault item per secret; the value is read from the item's password.
    # Empty name: <name>-openwebui-<secret>
    items:
      cookieSecret: ""
      secretKey: ""

gateway:
  # OpenAI-compatible model gateway the token proxy forwards to, for example
  # https://api.example.com (Open WebUI calls <upstream>/v1)
  upstream: ""
  # audience of the instance's ServiceAccount token. Empty: the host of upstream
  audience: ""

openwebui:
  # Open WebUI image
  image: ghcr.io/open-webui/open-webui:v0.12.3
  # title in the browser (WEBUI_NAME); empty: the Open WebUI default
  title: ""
  # true: settings changed in the admin panel win over these values after the first start
  persistentConfig: true
  # extra environment (name: value), see the Open WebUI environment reference
  env: {}
  # true: users, not only admins, may write tools (Python in this pod) and connect tool
  # servers from their browser
  memberTools: false
  # requests and limits; the first start loads a local embedding model
  resources:
    requests:
      cpu: 100m
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 16Gi

qdrant:
  # HTTP address of a Qdrant for document vectors, for example http://qdrant-qdrant:6333.
  # Empty: the built-in store on the data volume
  url: ""
  # Secret with the API key of that Qdrant, as chart qdrant makes it
  # (<release>-qdrant-api-key). Empty name: no key is sent
  apiKeySecret:
    name: ""
    key: api-key

mcp:
  # MCP endpoints of the gateway (<upstream>/mcp/<endpoint>) as tool servers for every
  # user, called through the token proxy. Needs persistentConfig false to apply after
  # the first start
  enabled: false
  # empty: the release namespace (tool prefix team) and public
  endpoints: []
  # - id: team
  #   endpoint: my-namespace

workbench:
  # image with open-terminal and jupyter-server on PATH; the terminal and notebook code
  # see what this image holds. Both sidecars keep HOME in workspace/ on the data volume
  image: ""
  terminal:
    # Open Terminal sidecar on 127.0.0.1, a terminal for every user in the chat
    enabled: false
    port: 8000
  jupyter:
    # Jupyter server sidecar on 127.0.0.1 as code execution and code interpreter engine
    enabled: false
    port: 8888
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 4Gi

oauthProxy:
  # OpenShift oauth-proxy in front of the UI; the cluster keeps this tag current
  image: image-registry.openshift-image-registry.svc:5000/openshift/oauth-proxy:v4.4
  # UI port of the pod
  port: 4180
  # login proxy requests and limits
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi

tokenProxy:
  # image that runs the token proxy script
  image: registry.access.redhat.com/ubi9/python-312-minimal
  # loopback port Open WebUI sends model calls to
  port: 8099
  # calls under paths carry the instance's own OpenID Connect token instead of the
  # ServiceAccount token: a client_credentials grant at tokenUrl, authenticated with a
  # ServiceAccount token for audience (federated client authentication). Empty: off
  agentToken:
    tokenUrl: ""
    # usually the realm's issuer URL
    audience: ""
    paths:
    - /mcp
  # token proxy requests and limits
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi

serviceAccount:
  # labels on the instance's ServiceAccount, for example the one a platform uses to
  # register it as an OpenID Connect client
  labels: {}

storage:
  # chats, uploads, settings (SQLite) and the embedding model cache
  size: 10Gi
  # ReadWriteOnce or ReadWriteMany; the Deployment stops the old pod first either way
  accessMode: ReadWriteOnce
  # empty: the default storage class
  className: ""

networkPolicy:
  # admit the login proxy from the router only
  enabled: true
