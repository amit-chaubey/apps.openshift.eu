{{- if .Values.oauth.allowedGroups }}
# The login proxy admits a user only with this permission (SAR)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openwebui.name" . }}-login
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
rules:
- apiGroups:
  - ""
  resources:
  - services/proxy
  resourceNames:
  - {{ include "openwebui.name" . }}
  verbs:
  - login
---
# Members of these OpenShift groups pass the login proxy's group check
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openwebui.name" . }}-login
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openwebui.name" . }}-login
subjects:
{{- range .Values.oauth.allowedGroups }}
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: {{ . }}
{{- end }}
{{- end }}
