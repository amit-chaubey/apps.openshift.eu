{{- if .Values.oauth.allowedGroups }}
{{- $name := include "openwebui.name" . }}
{{- $clusterRole := .Values.oauth.loginClusterRole }}
{{- if not $clusterRole }}
# The login proxy admits a user only with this permission (SAR)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-login
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
rules:
- apiGroups:
  - ""
  resources:
  - services/proxy
  resourceNames:
  - {{ $name }}
  verbs:
  - login
---
{{- end }}
# Members of these OpenShift groups pass the login proxy's group check
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  # roleRef is immutable: a ClusterRole binding has its own name
  name: {{ $name }}-{{ ternary "app-login" "login" (not (empty $clusterRole)) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ ternary "ClusterRole" "Role" (not (empty $clusterRole)) }}
  name: {{ default (printf "%s-login" $name) $clusterRole }}
subjects:
{{- range .Values.oauth.allowedGroups }}
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: {{ . }}
{{- end }}
{{- end }}
