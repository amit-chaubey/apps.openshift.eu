apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openwebui.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  # The owner's OpenShift user name only; empty: nobody logs in
  emails.txt: |
    {{- with include "openwebui.ownerEmail" . }}
    {{ . }}
    {{- end }}
  token-proxy.py: |
{{ .Files.Get "files/token-proxy.py" | indent 4 }}
