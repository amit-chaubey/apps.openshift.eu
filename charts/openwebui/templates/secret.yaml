{{- if eq .Values.secrets.type "kubernetes" }}
{{- $name := include "openwebui.name" . }}
{{- $existing := include "openwebui.existing" (dict "root" . "name" (printf "%s-secret-key" $name)) | fromJson }}
# Open WebUI signs its sessions with this key
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-secret-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
type: Opaque
data:
  secret-key: {{ include "openwebui.secretValue" (dict "value" .Values.secrets.secretKey "existing" $existing "key" "secret-key" "length" 48) | b64enc | quote }}
---
{{- $existing = include "openwebui.existing" (dict "root" . "name" (printf "%s-cookie-secret" $name)) | fromJson }}
{{- /* oauth-proxy accepts 16, 24 or 32 bytes: a value of another length is hashed to 32 */}}
{{- $cookie := .Values.secrets.cookieSecret }}
{{- if and $cookie (not (has (len $cookie) (list 16 24 32))) }}
{{- $cookie = $cookie | sha256sum | trunc 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-cookie-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
type: Opaque
data:
  cookie-secret: {{ include "openwebui.secretValue" (dict "value" $cookie "existing" $existing "key" "cookie-secret" "length" 32) | b64enc | quote }}
{{- end }}
