{{- if .Values.networkPolicy.enabled }}
# The login proxy only from the router
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openwebui.name" . }}
  namespace: {{ include "openwebui.namespace" . }}
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  podSelector:
    matchLabels:
      {{- include "openwebui.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: {{ .Values.oauthProxy.port }}
    from:
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/ingress: ""
    # a HostNetwork router sends from the node network
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/host-network: ""
{{- end }}
