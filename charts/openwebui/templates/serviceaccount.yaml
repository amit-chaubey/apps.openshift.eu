# Identity of the instance: OAuth client of the login and the gateway credential
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openwebui.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: {{ include "openwebui.redirectReference" . | quote }}
