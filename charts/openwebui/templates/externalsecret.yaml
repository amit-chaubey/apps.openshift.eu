{{- if eq .Values.secrets.type "externalSecret" }}
{{- $store := required "secrets.externalSecret.storeName is required" .Values.secrets.externalSecret.storeName }}
{{- $name := include "openwebui.name" . }}
{{- $items := .Values.secrets.externalSecret.items }}
{{- $secrets := list
  (dict "suffix" "secret-key" "item" $items.secretKey "key" "secret-key")
  (dict "suffix" "cookie-secret" "item" $items.cookieSecret "key" "cookie-secret")
}}
{{- range $i, $s := $secrets }}
{{- if $i }}
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-{{ $s.suffix }}
  namespace: {{ include "openwebui.namespace" $ }}
  labels:
    {{- include "openwebui.labels" $ | nindent 4 }}
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: {{ $.Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.secrets.externalSecret.storeKind }}
    name: {{ $store }}
  # ESO defaults, spelled out so a GitOps tool sees no drift
  target:
    name: {{ $name }}-{{ $s.suffix }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        {{ $s.key }}: "{{ "{{ .value }}" }}"
  data:
  - secretKey: value
    remoteRef:
      key: {{ default (printf "%s-%s" $name $s.suffix) $s.item }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- end }}
{{- end }}
