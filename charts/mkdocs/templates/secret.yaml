{{- if eq .Values.secrets.type "kubernetes" }}
{{- if and .Values.source.gitRepo .Values.source.private }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mkdocs.fullname" . }}-git
  labels:
    {{- include "mkdocs.labels" (dict "root" $ "component" "credentials") | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.source.gitUsername | quote }}
  password: {{ .Values.secrets.gitPassword | quote }}
---
{{- end }}
{{- if and .Values.source.gitRepo .Values.source.webhook }}
{{- $hook := printf "%s-webhook" (include "mkdocs.fullname" .) }}
{{- $foundHook := lookup "v1" "Secret" .Release.Namespace $hook }}
{{- $existingHook := dict }}
{{- if $foundHook }}{{- $existingHook = $foundHook.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $hook }}
  labels:
    {{- include "mkdocs.labels" (dict "root" $ "component" "credentials") | nindent 4 }}
type: Opaque
data:
  WebHookSecretKey: {{ include "mkdocs.secretValue" (dict "value" .Values.secrets.webhookSecret "existing" $existingHook "key" "WebHookSecretKey" "length" 48) | quote }}
---
{{- end }}
{{- if .Values.oauth.enabled }}
{{- $name := printf "%s-oauth" (include "mkdocs.fullname" .) }}
{{- $found := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existing := dict }}
{{- if $found }}{{- $existing = $found.data }}{{- end }}
{{- /* oauth2-proxy accepts 16, 24 or 32 bytes: a value of another length is hashed to 32 */}}
{{- $cookie := .Values.secrets.cookieSecret }}
{{- if and $cookie (not (has (len $cookie) (list 16 24 32))) }}
{{- $cookie = $cookie | sha256sum | trunc 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mkdocs.labels" (dict "root" $ "component" "credentials") | nindent 4 }}
type: Opaque
data:
  client-secret: {{ required "secrets.clientSecret is required when oauth.enabled" .Values.secrets.clientSecret | b64enc | quote }}
  cookie-secret: {{ include "mkdocs.secretValue" (dict "value" $cookie "existing" $existing "key" "cookie-secret" "length" 32) | quote }}
{{- end }}
{{- end }}
