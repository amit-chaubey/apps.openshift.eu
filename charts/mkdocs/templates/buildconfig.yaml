apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: {{ include "mkdocs.fullname" . }}
  labels:
    app: {{ include "mkdocs.fullname" $ | quote }}
    app.kubernetes.io/name: mkdocs
    app.kubernetes.io/component: build
    {{- include "mkdocs.commonLabels" $ | nindent 4 }}
spec:
  source:
    {{- if .Values.source.gitRepo }}
    type: Git
    git:
      uri: {{ .Values.source.gitRepo }}
      ref: {{ .Values.source.gitRef | quote }}
    {{- with .Values.source.contextDir }}
    contextDir: {{ . }}
    {{- end }}
    {{- if .Values.source.private }}
    sourceSecret:
      name: {{ include "mkdocs.fullname" . }}-git
    {{- end }}
    {{- else }}
    type: Dockerfile
    {{- end }}
    dockerfile: |-
      {{- include "mkdocs.dockerfile" . | nindent 6 }}
  strategy:
    type: Docker
    dockerStrategy: {}
  output:
    to:
      kind: ImageStreamTag
      name: {{ include "mkdocs.fullname" . }}:latest
  resources:
    {{- toYaml .Values.build.resources | nindent 4 }}
  triggers:
  - type: ConfigChange
  {{- if and .Values.source.gitRepo .Values.source.webhook }}
  {{- range $type, $key := dict "GitLab" "gitlab" "GitHub" "github" "Generic" "generic" }}
  - type: {{ $type }}
    {{ $key }}:
      secretReference:
        name: {{ include "mkdocs.fullname" $ }}-webhook
  {{- end }}
  {{- end }}
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3
