apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mkdocs.fullname" . }}
  labels:
    {{- include "mkdocs.labels" (dict "root" $ "component" "web") | nindent 4 }}
    app.openshift.io/runtime: nginx
  annotations:
    app.openshift.io/vcs-uri: https://github.com/mkdocs/mkdocs
    {{- if and .Values.source.gitRepo .Values.source.webhook }}
    # restarts the site after a build; a GitOps tool must ignore the image field
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"{{ include "mkdocs.fullname" . }}:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"mkdocs\")].image"}]'
    {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "mkdocs.fullname" . }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ include "mkdocs.fullname" . }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: nginx
        configMap:
          name: {{ include "mkdocs.fullname" . }}-nginx
      containers:
      - name: mkdocs
        # a fixed tag: the poller restarts the pods after a build. With
        # source.webhook an image trigger rewrites this field instead
        image: {{ .Values.build.registry }}/{{ .Release.Namespace }}/{{ include "mkdocs.fullname" . }}:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: site
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: nginx
          mountPath: /opt/app-root/etc/nginx.default.d
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      {{- if .Values.oauth.enabled }}
      - name: oauth2-proxy
        image: {{ .Values.oauth.image }}
        args:
        - --provider=oidc
        - --oidc-issuer-url={{ required "oauth.issuerUrl is required when oauth.enabled" .Values.oauth.issuerUrl }}
        - --client-id={{ required "oauth.clientId is required when oauth.enabled" .Values.oauth.clientId }}
        {{- if .Values.route.hostname }}
        - --redirect-url=https://{{ .Values.route.hostname }}/oauth2/callback
        {{- end }}
        - --upstream=http://127.0.0.1:8080
        - --http-address=0.0.0.0:4180
        - --reverse-proxy=true
        - --scope={{ .Values.oauth.scope }}
        - --oidc-groups-claim={{ .Values.oauth.groupsClaim }}
        {{- range .Values.oauth.allowedGroups }}
        {{- if . }}
        - --allowed-group={{ . }}
        {{- end }}
        {{- end }}
        {{- range .Values.oauth.emailDomains }}
        - --email-domain={{ . }}
        {{- end }}
        - --cookie-secure=true
        - --cookie-samesite=lax
        - --skip-provider-button=true
        {{- range .Values.oauth.extraArgs }}
        - {{ . }}
        {{- end }}
        env:
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "mkdocs.fullname" . }}-oauth
              key: client-secret
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "mkdocs.fullname" . }}-oauth
              key: cookie-secret
        ports:
        - containerPort: 4180
          name: proxy
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        readinessProbe:
          httpGet:
            path: /ping
            port: 4180
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /ping
            port: 4180
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.oauth.resources | nindent 10 }}
      {{- end }}
