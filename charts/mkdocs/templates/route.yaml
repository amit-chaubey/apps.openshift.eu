apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "mkdocs.fullname" . }}
  labels:
    app: {{ include "mkdocs.fullname" $ | quote }}
    app.kubernetes.io/name: mkdocs
    app.kubernetes.io/component: route
    {{- include "mkdocs.commonLabels" $ | nindent 4 }}
spec:
  {{- if .Values.route.hostname }}
  host: {{ .Values.route.hostname }}
  {{- end }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: {{ include "mkdocs.fullname" . }}
    weight: 100
  wildcardPolicy: None
