{{- if .Values.oauth.enabled }}
# opens only the proxy port. Policies add up, so this closes nothing that
# another policy opens; nginx refuses direct requests itself (configmap.yaml)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mkdocs.fullname" . }}
  labels:
    app: {{ include "mkdocs.fullname" $ | quote }}
    app.kubernetes.io/name: mkdocs
    app.kubernetes.io/component: network
    {{- include "mkdocs.commonLabels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "mkdocs.fullname" . }}
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 4180
{{- end }}
