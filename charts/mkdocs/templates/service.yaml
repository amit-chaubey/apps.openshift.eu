apiVersion: v1
kind: Service
metadata:
  name: {{ include "mkdocs.fullname" . }}
  labels:
    {{- include "mkdocs.labels" (dict "root" $ "component" "web") | nindent 4 }}
spec:
  selector:
    app: {{ include "mkdocs.fullname" . }}
  ports:
  - name: http
    port: 80
    targetPort: {{ if .Values.oauth.enabled }}4180{{ else }}8080{{ end }}
