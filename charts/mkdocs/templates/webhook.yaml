{{- if and .Values.source.gitRepo .Values.source.webhook }}
# the Git server calls the build webhook without a login; the address holds the secret
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mkdocs.fullname" . }}-webhook
  labels:
    {{- include "mkdocs.labels" (dict "root" $ "component" "rbac") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:webhook
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:unauthenticated
{{- end }}
