{{- if eq .Values.secrets.type "kubernetes" }}
{{- $found := lookup "v1" "Secret" .Release.Namespace "vaultwarden-credentials" }}
{{- $existing := dict }}
{{- if $found }}{{- $existing = $found.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: vaultwarden-credentials
  labels:
    {{- include "vaultwarden.labels" (dict "root" $ "component" "credentials") | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.adminToken }}
  admin-token: {{ .Values.secrets.adminToken | b64enc | quote }}
  {{- else if hasKey $existing "admin-token" }}
  admin-token: {{ index $existing "admin-token" | quote }}
  {{- else }}
  admin-token: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
  smtp-password: {{ .Values.secrets.smtpPassword | b64enc | quote }}
{{- else }}
{{- $es := .Values.secrets.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-credentials
  labels:
    {{- include "vaultwarden.labels" (dict "root" $ "component" "credentials") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ required "secrets.externalSecret.storeName is required" $es.storeName }}
  target:
    name: vaultwarden-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  {{- range $key, $item := $es.items }}
  {{- if or (ne $key "smtp-password") $.Values.smtp.host }}
  - secretKey: {{ $key }}
    remoteRef:
      key: {{ $item }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  {{- end }}
  {{- end }}
{{- end }}
