{{- if and .Values.image.repository .Values.auth.enabled (not .Values.auth.existingSecret) }}
# Cookie and client secret of the token check, generated once and kept on upgrade
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-auth.secretName" (dict "root" . "name" .Release.Name) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
type: Opaque
data:
  {{- include "mcp-auth.secretData" (dict "root" . "name" .Release.Name "namespace" .Release.Namespace) | nindent 2 }}
{{- end }}
