{{- if and .Values.image.repository .Values.networkPolicy.enabled }}
# Callers: the own project and the listed namespaces (an MCP gateway)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-server.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  {{- if .Values.networkPolicy.egress.enabled }}
  - Egress
  {{- end }}
  ingress:
  - ports:
    - protocol: TCP
      port: {{ if .Values.rbacProxy.enabled }}{{ .Values.rbacProxy.port }}{{ else }}{{ .Values.port }}{{ end }}
    from:
    - podSelector: {}
    {{- range .Values.networkPolicy.ingressNamespaces }}
    - namespaceSelector:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  {{- with .Values.networkPolicy.egress }}
  {{- if .enabled }}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .dnsNamespace }}
    ports:
    - protocol: UDP
      port: {{ .dnsPort }}
    - protocol: TCP
      port: {{ .dnsPort }}
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        {{- range concat .exceptCidrs .extraExceptCidrs }}
        - {{ . }}
        {{- end }}
  {{- range .allow }}
  - to:
    - ipBlock:
        cidr: {{ .cidr }}
    {{- with .ports }}
    ports:
    {{- range . }}
    - protocol: TCP
      port: {{ . }}
    {{- end }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
