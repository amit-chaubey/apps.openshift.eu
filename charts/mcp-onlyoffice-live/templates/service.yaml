{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-onlyoffice-live.name" . }}
  namespace: {{ include "mcp-onlyoffice-live.namespace" . }}
  labels:
    app: {{ include "mcp-onlyoffice-live.name" . }}
    app.kubernetes.io/name: mcp-onlyoffice-live
    app.kubernetes.io/component: server
    {{- include "mcp-onlyoffice-live.commonLabels" . | nindent 4 }}
    {{- include "mcp-onlyoffice-live.catalogLabels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    agentgateway.dev/mcp-path: /mcp
    agentgateway.dev/mcp-target-name: {{ include "mcp-onlyoffice-live.name" . | quote }}
spec:
  type: ClusterIP
  selector:
    {{- include "mcp-onlyoffice-live.selectorLabels" . | nindent 4 }}
  ports:
  - name: mcp
    port: {{ .Values.port }}
    targetPort: mcp
    protocol: TCP
    {{- with .Values.mcp.appProtocol }}
    appProtocol: {{ . }}
    {{- end }}
{{- end }}
