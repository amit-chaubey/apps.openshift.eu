{{- if and .Values.enabled .Values.networkPolicy.enabled }}
# Callers: the own project, the listed namespaces (an MCP gateway) and, with the Route, the
# router. The server reaches Nextcloud and the Document Server, nothing else of the cluster
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-onlyoffice-live.name" . }}
  namespace: {{ include "mcp-onlyoffice-live.namespace" . }}
  labels:
    app: {{ include "mcp-onlyoffice-live.name" . }}
    app.kubernetes.io/name: mcp-onlyoffice-live
    app.kubernetes.io/component: server
    {{- include "mcp-onlyoffice-live.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-onlyoffice-live.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  {{- if .Values.networkPolicy.egress.enabled }}
  - Egress
  {{- end }}
  ingress:
  - ports:
    - protocol: TCP
      port: {{ .Values.port }}
    from:
    - podSelector: {}
    {{- range .Values.networkPolicy.ingressNamespaces }}
    - namespaceSelector:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- if .Values.route.enabled }}
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: ingress
    {{- end }}
  {{- with .Values.networkPolicy.egress }}
  {{- if .enabled }}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .dnsNamespace }}
    ports:
    - protocol: UDP
      port: {{ .dnsPort }}
    - protocol: TCP
      port: {{ .dnsPort }}
  - to:
    - podSelector: {}
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    {{- range .webPorts }}
    - protocol: TCP
      port: {{ . }}
    {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
