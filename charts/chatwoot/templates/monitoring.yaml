{{- if and .Values.odoo.enabled .Values.monitoring.enabled (not (include "wrapper.standalone" .)) }}
{{- $ns := .Release.Namespace }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: chatwoot-odoo-bridge
  labels:
    app: chatwoot-odoo-bridge
    app.kubernetes.io/name: chatwoot-odoo-bridge
    app.kubernetes.io/component: monitoring
    {{- include "chatwoot.commonLabels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: chatwoot-odoo-bridge
  endpoints:
  - port: webhook
    path: /metrics
    scheme: http
{{- if .Values.monitoring.alerts }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: chatwoot-odoo-bridge
  labels:
    app: chatwoot-odoo-bridge
    app.kubernetes.io/name: chatwoot-odoo-bridge
    app.kubernetes.io/component: monitoring
    {{- include "chatwoot.commonLabels" $ | nindent 4 }}
spec:
  groups:
  - name: chatwoot-odoo-bridge
    rules:
    - alert: ChatwootOdooBridgeDown
      # absent: a pod that is gone leaves no target and no up series
      expr: up{namespace="{{ $ns }}",service="chatwoot-odoo-bridge"} == 0 or absent(up{namespace="{{ $ns }}",service="chatwoot-odoo-bridge"})
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: The Chatwoot Odoo bridge is unreachable
        description: No metrics for 5m. Staff replies are not sent to customers and Odoo events wait in the Odoo outbox.
    - alert: ChatwootOdooBridgeReplyLost
      expr: increase(chatwoot_odoo_bridge_webhooks_total{namespace="{{ $ns }}",result=~"given_up|dropped"}[1h]) > 0
      labels:
        severity: warning
      annotations:
        summary: A staff reply did not reach Odoo
        description: The bridge gave up a webhook after its retries, or stopped while it waited; the conversation has a private note asking staff to send it again.
    - alert: ChatwootOdooBridgeEventsFailing
      # Odoo retries an event up to 2 hours apart: three errors in 4 hours is one that keeps failing
      expr: increase(chatwoot_odoo_bridge_events_total{namespace="{{ $ns }}",result="error"}[4h]) > 2
      labels:
        severity: warning
      annotations:
        summary: Odoo events keep failing in the Chatwoot bridge
        description: More than two Odoo events failed in 4 hours; they wait in the Odoo outbox, which retries up to 8 times over about 4 hours.
{{- end }}
{{- end }}
