{{- if and .Values.odoo.enabled (not (include "wrapper.standalone" .)) }}
{{- /*
The Odoo bridge: Odoo posts its signed events to the Route below (port events), the API
inboxes post their signed webhooks inside the namespace (port webhook, worker pods only).
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatwoot-odoo-bridge
  labels:
    app: chatwoot-odoo-bridge
    app.kubernetes.io/name: chatwoot-odoo-bridge
    app.kubernetes.io/component: bridge
    {{- include "chatwoot.commonLabels" $ | nindent 4 }}
    app.openshift.io/runtime: python
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"chatwoot-web"}]'
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  # the retry queue and the record locks live in the process: never two pods
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chatwoot-odoo-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatwoot-odoo-bridge
      annotations:
        checksum/scripts: {{ include (print $.Template.BasePath "/configmap-scripts.yaml") (merge (dict "checksum" true) .) | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "wrapper.podSecurity" . | nindent 8 }}
      containers:
      - name: odoo-bridge
        image: {{ .Values.odoo.bridge.image }}
        command: ["python3", "/scripts/odoo_bridge.py"]
        env:
        - name: CHATWOOT_URL
          value: http://chatwoot-web:3000
        - name: CHATWOOT_ACCOUNT_ID
          value: {{ .Values.account.id | quote }}
        - name: PUBLIC_URL
          value: https://{{ .Values.route.hostname }}
        - name: CHATWOOT_TOKEN_FILE
          value: /etc/chatwoot-odoo-bridge/odoo-bridge-token
        - name: INBOX_SECRET_FILE
          value: /etc/chatwoot-odoo-bridge/odoo-inbox-secret
        - name: TICKET_INBOX
          value: {{ .Values.odoo.ticketInbox | quote }}
        - name: LEAD_INBOX
          value: {{ .Values.odoo.leadInbox | quote }}
        - name: ODOO_URL
          value: {{ .Values.odoo.url | trimSuffix "/" | quote }}
        - name: ODOO_DATABASE
          value: {{ .Values.odoo.database | quote }}
        - name: ODOO_API_KEY_FILE
          value: /etc/chatwoot-odoo/odoo-api-key
        - name: EVENT_SECRET_FILE
          value: /etc/chatwoot-odoo/odoo-event-secret
        - name: SOLVED_STAGE
          value: {{ .Values.odoo.solvedStage | quote }}
        - name: WEBHOOK_PORT
          value: "8080"
        - name: EVENT_PORT
          value: "8081"
        ports:
        - name: webhook
          containerPort: 8080
        - name: events
          containerPort: 8081
        securityContext:
          {{- include "wrapper.restricted" . | nindent 10 }}
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: odoo
          mountPath: /etc/chatwoot-odoo
          readOnly: true
        - name: bridge
          mountPath: /etc/chatwoot-odoo-bridge
          readOnly: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: events
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /healthz
            port: webhook
          periodSeconds: 30
        resources:
          {{- toYaml .Values.odoo.bridge.resources | nindent 10 }}
      # a running event finishes; an unfinished one is retried by Odoo
      terminationGracePeriodSeconds: 30
      volumes:
      - name: scripts
        configMap:
          name: chatwoot-scripts
      # readable by the pod's fsGroup: the random user id owns no file
      - name: odoo
        secret:
          secretName: chatwoot-odoo
          defaultMode: 0440
      - name: bridge
        secret:
          secretName: chatwoot-odoo-bridge
          defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: chatwoot-odoo-bridge
  labels:
    app: chatwoot-odoo-bridge
    app.kubernetes.io/name: chatwoot-odoo-bridge
    app.kubernetes.io/component: bridge
    {{- include "chatwoot.commonLabels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: chatwoot-odoo-bridge
  ports:
  - name: webhook
    port: 8080
    targetPort: webhook
  - name: events
    port: 8081
    targetPort: events
---
{{- /* Odoo's way in, on the host of the instance; every event is signed */}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: chatwoot-odoo-bridge
  labels:
    app: chatwoot-odoo-bridge
    app.kubernetes.io/name: chatwoot-odoo-bridge
    app.kubernetes.io/component: route
    {{- include "chatwoot.commonLabels" $ | nindent 4 }}
spec:
  host: {{ .Values.route.hostname }}
  path: /odoo/events
  to:
    kind: Service
    name: chatwoot-odoo-bridge
    weight: 100
  port:
    targetPort: events
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
