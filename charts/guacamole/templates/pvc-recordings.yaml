{{- if .Values.recording.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "guacamole.fullname" . }}-recordings
  labels:
    app: {{ include "guacamole.fullname" $ | quote }}
    app.kubernetes.io/name: guacamole
    app.kubernetes.io/component: storage
    {{- include "guacamole.commonLabels" $ | nindent 4 }}
  annotations:
    # recordings are evidence: uninstalling the chart keeps them
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.recording.size }}
  {{- if .Values.recording.storageClassName }}
  storageClassName: {{ .Values.recording.storageClassName }}
  {{- end }}
{{- end }}
