# opens only the web port, and only to the router. Policies add up, so this
# closes nothing that another policy opens; guacd listens on localhost only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "guacamole.fullname" . }}
  labels:
    app: {{ include "guacamole.fullname" $ | quote }}
    app.kubernetes.io/name: guacamole
    app.kubernetes.io/component: network
    {{- include "guacamole.commonLabels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "guacamole.fullname" . }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: ingress
    ports:
    - protocol: TCP
      port: 8080
