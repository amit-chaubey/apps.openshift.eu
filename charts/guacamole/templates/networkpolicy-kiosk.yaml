{{- if .Values.kiosk.enabled }}
# the VNC port of the desktop, for guacd in the Guacamole pod only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "guacamole.kiosk" . }}
  labels:
    app: {{ include "guacamole.kiosk" $ | quote }}
    app.kubernetes.io/name: guacamole
    app.kubernetes.io/component: network
    {{- include "guacamole.commonLabels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "guacamole.kiosk" . }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: {{ include "guacamole.fullname" . }}
    ports:
    - protocol: TCP
      port: 5900
{{- end }}
