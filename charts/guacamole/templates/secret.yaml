{{- if eq .Values.secrets.type "kubernetes" }}
{{- $name := include "guacamole.fullname" . }}
{{- $found := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existing := dict }}
{{- if $found }}{{- $existing = $found.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app: {{ include "guacamole.fullname" $ | quote }}
    app.kubernetes.io/name: guacamole
    app.kubernetes.io/component: credentials
    {{- include "guacamole.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  adminPassword: {{ include "guacamole.secretValue" (dict "value" .Values.secrets.adminPassword "existing" $existing "key" "adminPassword" "length" 32) | quote }}
  vncPassword: {{ include "guacamole.secretValue" (dict "value" .Values.secrets.vncPassword "existing" $existing "key" "vncPassword" "length" 32) | quote }}
{{- end }}
