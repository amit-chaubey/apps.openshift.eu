{{- if eq .Values.secrets.type "externalSecret" }}
{{- $store := required "secrets.externalSecret.storeName is required" .Values.secrets.externalSecret.storeName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "guacamole.fullname" . }}
  labels:
    app: {{ include "guacamole.fullname" $ | quote }}
    app.kubernetes.io/name: guacamole
    app.kubernetes.io/component: credentials
    {{- include "guacamole.commonLabels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secrets.externalSecret.storeKind }}
    name: {{ $store }}
  target:
    name: {{ include "guacamole.fullname" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: adminPassword
    remoteRef:
      key: {{ .Values.secrets.externalSecret.items.adminPassword }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  - secretKey: vncPassword
    remoteRef:
      key: {{ .Values.secrets.externalSecret.items.vncPassword }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- end }}
