{{- $name := include "goose.name" . }}
{{- $ns := include "goose.namespace" . }}
{{- if and .Values.a2a.enabled .Values.a2a.kagent.enabled (.Capabilities.APIVersions.Has "kagent.dev/v1alpha2/Agent") }}
# kagent runs a BYO agent as its own Deployment on port 8080; that pod relays to the
# A2A Service of goose; kagent forwards its caller's token
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "goose.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  type: BYO
  description: {{ include "goose.a2aDescription" . | quote }}
  byo:
    deployment:
      image: {{ .Values.tokenProxy.image }}
      cmd: python3
      args:
      - /app/a2a-relay.py
      # an existing account: kagent creates none, so the release's own name stays free
      serviceAccountName: default
      env:
      - name: UPSTREAM
        value: http://{{ $name }}-a2a.{{ $ns }}.svc:{{ .Values.a2a.port }}
      volumes:
      - name: scripts
        configMap:
          name: {{ $name }}
      volumeMounts:
      - name: scripts
        mountPath: /app
        readOnly: true
      resources:
        {{- toYaml .Values.a2a.kagent.resources | nindent 8 }}
{{- end }}
{{- if and .Values.a2a.enabled .Values.a2a.gatewayNamespace }}
---
# HTTPRoutes of the gateway namespace may reach this agent's kagent Service only
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ $name }}-a2a
  namespace: {{ $ns }}
  labels:
    {{- include "goose.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: {{ .Values.a2a.gatewayNamespace }}
  to:
  - group: ""
    kind: Service
    name: {{ $name }}
{{- end }}
