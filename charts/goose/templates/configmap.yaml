apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "goose.name" . }}
  namespace: {{ include "goose.namespace" . }}
  labels:
    {{- include "goose.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  # The owner's OpenShift user name only; empty: no emails file, the SAR admits
  emails.txt: |
    {{- with .Values.oauth.ownerEmail }}
    {{ . }}
    {{- end }}
  token-proxy.py: |
{{ .Files.Get "files/token-proxy.py" | indent 4 }}
  a2a-bridge.py: |
{{ .Files.Get "files/a2a-bridge.py" | indent 4 }}
  a2a-relay.py: |
{{ .Files.Get "files/a2a-relay.py" | indent 4 }}
