{{- if not (or .Values.jira.url .Values.confluence.url) }}{{ fail "jira.url or confluence.url is required" }}{{ end }}
{{- if and (eq .Values.credentials.mode "shared") (not .Values.credentials.existingSecret) }}{{ fail "credentials.existingSecret is required in shared mode" }}{{ end }}
{{- if and .Values.credentials.callerOverride (not .Values.credentials.gatewayHeader) }}{{ fail "credentials.callerOverride needs credentials.gatewayHeader" }}{{ end }}
{{- if and .Values.auth.enabled .Values.credentials.callerOverride }}{{ fail "credentials.callerOverride cannot be combined with auth.enabled: the caller's account replaces the Authorization header that the token check reads" }}{{ end }}
{{- if and .Values.auth.enabled (eq .Values.credentials.mode "perCaller") }}{{ fail "auth.enabled needs credentials.mode shared: the token check takes the Authorization header that perCaller mode reads the Atlassian account from" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ include "mcp-atlassian.namespace" . }}
  labels:
    {{- include "mcp-atlassian.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  annotations:
    app.openshift.io/custom-icon: https://avatars.githubusercontent.com/atlassian
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mcp-atlassian.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-atlassian.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # the server needs no Kubernetes API access
      automountServiceAccountToken: false
      containers:
      - name: server
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - --transport
        - streamable-http
        - --stateless
        # with auth.enabled only the token check in the same pod reaches the server
        - --host
        - {{ include "mcp-auth.serverHost" . }}
        - --port
        - {{ include "mcp-auth.serverPort" (dict "root" . "port" .Values.port) | quote }}
        env:
        - name: HOME
          value: /tmp
        {{- with .Values.jira.url }}
        - name: JIRA_URL
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.confluence.url }}
        - name: CONFLUENCE_URL
          value: {{ . | quote }}
        {{- end }}
        {{- if eq .Values.credentials.mode "perCaller" }}
        # every request carries its caller's account; without one the server refuses
        - name: ALLOW_GLOBAL_CRED_FALLBACK
          value: "false"
        # builds the Jira and Confluence configuration from the URLs alone
        - name: ATLASSIAN_OAUTH_ENABLE
          value: "true"
        {{- else }}
        - name: ALLOW_GLOBAL_CRED_FALLBACK
          value: "true"
        {{- end }}
        {{- with .Values.credentials.cloudId }}
        # Bearer tokens address the site through api.atlassian.com by this cloud ID
        - name: ATLASSIAN_OAUTH_CLOUD_ID
          value: {{ . | quote }}
        {{- end }}
        {{- range $k, $v := .Values.env }}
        - name: {{ $k }}
          value: {{ $v | toString | quote }}
        {{- end }}
        {{- if eq .Values.credentials.mode "shared" }}
        envFrom:
        - secretRef:
            name: {{ .Values.credentials.existingSecret }}
        {{- end }}
        {{- if .Values.auth.enabled }}
        # through the token check, which lets /healthz pass
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.port }}
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.port }}
          initialDelaySeconds: 20
          periodSeconds: 30
        {{- else }}
        ports:
        - name: mcp
          containerPort: {{ .Values.port }}
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: mcp
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: mcp
          initialDelaySeconds: 20
          periodSeconds: 30
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      {{- if .Values.auth.enabled }}
      {{- include "mcp-auth.container" (dict "root" . "name" .Release.Name "port" .Values.port "healthPath" "/healthz") | nindent 6 }}
      {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
      {{- with include "mcp-auth.volumes" (dict "root" . "name" .Release.Name) }}
      {{- . | nindent 6 }}
      {{- end }}
