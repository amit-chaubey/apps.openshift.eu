# Team of the tenant the app serves: the chart puts every object into <tenant>-<team>, a
# namespace the team already has. Empty: the release namespace
team: ""
# Tenant the app belongs to; required with team
tenant: ""

person:
  # short lowercase name; objects are named <name>-agent. Empty: the release name
  name: ""
  # Git identity; also the UI owner when oauth.ownerEmail is empty
  email: ""
  # one line appended to the agent instructions, for example "I am sales"
  role: ""

route:
  # empty: OpenShift assigns a host under the default application domain
  host: ""
  # extra labels on the Route only, for example to pick a router shard
  labels: {}
  # the UI streams over SSE; the router must not cut idle streams
  timeout: 3600s
  # used when a host is set; certificate issued by cert-manager
  annotations:
    cert-manager.io/issuer-kind: ClusterIssuer
    cert-manager.io/issuer-name: letsencrypt

oauth:
  # OpenShift user name (an email) of the only person admitted to the UI.
  # Empty: person.email; both empty: everyone who may edit the project
  ownerEmail: ""
  # OpenShift groups admitted, strictly (with an owner: the owner must be in one)
  allowedGroups: []
  # ClusterRole holding the verb login on services/proxy that allowedGroups are bound
  # to. Empty: the chart's own Role, which only an installer holding that verb (a
  # cluster admin) can create
  loginClusterRole: ""

secrets:
  # kubernetes: Secrets from the values below. externalSecret: from a secret store
  type: kubernetes
  # empty: generated once and kept on upgrade. A value that is not 16, 24 or
  # 32 characters long is hashed to 32
  cookieSecret: ""
  # password between the UI proxy, the A2A adapter and OpenCode. Empty: generated once
  serverPassword: ""
  # bearer token the A2A adapter accepts. Empty: generated once
  a2aToken: ""
  # access token for git.url, sent to the host of git.url only
  gitToken: ""
  externalSecret:
    storeKind: ClusterSecretStore
    storeName: ""
    refreshInterval: 1h
    # one vault item per secret; the value is read from the item's password.
    # Empty name: <name>-agent-<secret>
    items:
      cookieSecret: ""
      serverPassword: ""
      a2aToken: ""
      gitToken: ""

git:
  # repository cloned into /workspace on first start; empty: no clone. The token
  # is secrets.gitToken
  url: ""
  # branch of the first clone
  branch: main

gateway:
  # model and A2A gateway the token proxy forwards to, for example https://api.example.com
  upstream: ""
  # audience of the agent's ServiceAccount token. Empty: the host of upstream
  audience: ""

a2a:
  # namespace of the gateway's HTTPRoutes that publish A2A. Empty: none
  gatewayNamespace: ""
  # inbound Host header allowlist (A2A_ALLOWED_HOSTS); empty disables the check
  allowedHosts: []
  # Agent Card base URL. Empty: the in-cluster Service URL
  publicUrl: ""
  # agents this agent may call with the a2a_call tool: a name, or
  # {name: <agent>, namespace: <namespace>}; the namespace defaults to the release
  # namespace. Each is reached at <gateway.upstream origin>/a2a/<namespace>/<name>/
  # through the token proxy. Empty: no A2A tools
  peers: []
  # opencode-a2a release with the OpenCode 2.x API (OPENCODE_API_VERSION=v2)
  version: 2.0.0+hoolia.2
  # pip requirement the adapter image installs; a source archive needs no git
  package: opencode-a2a @ https://github.com/hoolia/opencode-a2a/archive/refs/tags/v2.0.0%2Bhoolia.2.tar.gz
  # Callers of the agent's tenant reach it with their own bearer JWT, next to the static
  # credentials: a ServiceAccount token from a namespace <tenant> or <tenant>-*, or an
  # OIDC token whose groups claim holds <tenant> or <tenant>-*. kagent forwards its
  # caller's token. Needs the adapter version above or later
  tenantAuth:
    enabled: true
    # empty: the release namespace up to its first "-"
    tenant: ""
    # the cluster's ServiceAccount token issuer; empty: none
    kubernetesIssuer: https://kubernetes.default.svc
    # OIDC issuers, for example https://login.example/realms/<realm>
    oidcIssuers: []
  # the A2A task store needs SQLite 3.35 or later (RETURNING); UBI 9 ships 3.34
  baseImage: registry.access.redhat.com/ubi10/python-312-minimal
  # prebuilt adapter image; required when builds.enabled is false
  image: ""
  # adapter container requests and limits
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi

opencode:
  # OpenCode release; 2.x migrates the session store in place, see backup-db.sh
  version: 2.1.1
  # OpenCode image the build starts from
  baseImage: ghcr.io/anomalyco/opencode
  # prebuilt image with the toolset and /tools/kubernetes-mcp-server, used when builds.enabled is false.
  # Empty: baseImage:version
  image: ""
  # npm plugins OpenCode installs on start, for example a model provider plugin
  plugins: []
  # "@scope": <registry URL> for those installs, written to ~/.npmrc
  npmScopes: {}
  # extra environment for the opencode container (name: value)
  env: {}
  # providers off by default; opencode is opencode.ai's public inference, outside your gateway.
  # A user turns one back on with an allow policy in ~/.config/opencode/opencode.json
  disabledProviders:
  - opencode
  # merged over the generated opencode.json
  config: {}
  # opencode container requests and limits; an agent at work peaks near 10 cores
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "8"
      memory: 16Gi

tools:
  # Go image that builds the odf CLI, which has no binary release, from source
  goImage: docker.io/library/golang:1.26-alpine
  # Git repository of the odf CLI; the newest commit of its default branch is built
  odfRepository: https://github.com/red-hat-storage/odf-cli

kubernetesMcpServer:
  # image the kubernetes-mcp-server binary is copied from
  image: quay.io/containers/kubernetes_mcp_server:v0.0.67

builds:
  # build the opencode (with the toolset) and opencode-a2a images in the project
  enabled: true
  # registry of the cluster, where the builds push and the pod pulls
  registry: image-registry.openshift-image-registry.svc:5000
  # node labels for the build pods; a build writes several Gi of layers to the node
  nodeSelector: {}
  # build pod requests and limits; compiling the odf CLI needs several Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 6Gi

oauthProxy:
  # OpenShift oauth-proxy in front of the UI; the cluster keeps this tag current
  image: image-registry.openshift-image-registry.svc:5000/openshift/oauth-proxy:v4.4
  # UI port of the pod
  port: 4180
  # login proxy requests and limits
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi

uiProxy:
  # loopback port oauth-proxy sends the UI to; runs on tokenProxy.image
  port: 4097
  # UI proxy requests and limits
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi

tokenProxy:
  # image that runs the token proxy script
  image: registry.access.redhat.com/ubi9/python-312-minimal
  # loopback port OpenCode sends model and A2A calls to
  port: 8099
  # calls under paths carry the agent's own OpenID Connect token instead of the
  # ServiceAccount token: a client_credentials grant at tokenUrl, authenticated with a
  # ServiceAccount token for audience (federated client authentication). Empty: off
  agentToken:
    tokenUrl: ""
    # usually the realm's issuer URL
    audience: ""
    paths:
    - /mcp
  # token proxy requests and limits
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi

# node labels and affinity of the agent pod; the OpenCode image is several Gi
nodeSelector: {}
affinity: {}

# labels on the kagent Agent, for example the one a platform uses to register the
# ServiceAccount kagent creates for it as an OpenID Connect client
agentLabels: {}

serviceAccount:
  # empty: <name>-agent, created by kagent; another name is created by the chart
  name: ""
  # labels on a ServiceAccount the chart creates, for example the one a platform uses
  # to register it as an OpenID Connect client
  labels: {}

storage:
  # work tree, OpenCode home and session store
  size: 20Gi
  # the only accepted mode: a rolling update starts the new pod before the old one stops
  accessMode: ReadWriteMany
  # empty: the default storage class
  className: ""

networkPolicy:
  # admit the UI from the router and A2A from the listed namespaces only
  enabled: true
  # more namespaces that may call A2A on 8080; a2a.gatewayNamespace always may
  a2aNamespaces: []
