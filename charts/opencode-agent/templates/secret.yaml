{{- if eq .Values.secrets.type "kubernetes" }}
{{- $name := include "opencode-agent.name" . }}
{{- $existing := include "opencode-agent.existing" (dict "root" . "name" (printf "%s-server-password" $name)) | fromJson }}
{{- $password := include "opencode-agent.secretValue" (dict "value" .Values.secrets.serverPassword "existing" $existing "key" "password" "length" 48) }}
# OpenCode server password; the UI proxy sends it, the browser never sees it
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-server-password
  namespace: {{ include "opencode-agent.namespace" . }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: opencode-agent
    app.kubernetes.io/component: credentials
    {{- include "opencode-agent.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
  # oauth-proxy reads the password from a config file only
  oauth-proxy.cfg: {{ printf "basic_auth_password = %s\n" (toJson $password) | b64enc | quote }}
---
{{- $existing = include "opencode-agent.existing" (dict "root" . "name" (printf "%s-a2a-auth" $name)) | fromJson }}
{{- $token := include "opencode-agent.secretValue" (dict "value" .Values.secrets.a2aToken "existing" $existing "key" "token" "length" 48) }}
# Inbound A2A bearer, known only to the pod and the A2A gateway
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-a2a-auth
  namespace: {{ include "opencode-agent.namespace" . }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: opencode-agent
    app.kubernetes.io/component: credentials
    {{- include "opencode-agent.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
  credentials: {{ list (dict "scheme" "bearer" "token" $token "principal" "gateway") | toJson | b64enc | quote }}
---
{{- $existing = include "opencode-agent.existing" (dict "root" . "name" (printf "%s-cookie-secret" $name)) | fromJson }}
{{- /* oauth-proxy accepts 16, 24 or 32 bytes: a value of another length is hashed to 32 */}}
{{- $cookie := .Values.secrets.cookieSecret }}
{{- if and $cookie (not (has (len $cookie) (list 16 24 32))) }}
{{- $cookie = $cookie | sha256sum | trunc 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-cookie-secret
  namespace: {{ include "opencode-agent.namespace" . }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: opencode-agent
    app.kubernetes.io/component: credentials
    {{- include "opencode-agent.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  cookie-secret: {{ include "opencode-agent.secretValue" (dict "value" $cookie "existing" $existing "key" "cookie-secret" "length" 32) | b64enc | quote }}
{{- if .Values.git.url }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-git-token
  namespace: {{ include "opencode-agent.namespace" . }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: opencode-agent
    app.kubernetes.io/component: credentials
    {{- include "opencode-agent.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  token: {{ .Values.secrets.gitToken | b64enc | quote }}
{{- end }}
{{- end }}
