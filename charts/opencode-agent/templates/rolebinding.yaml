# The agent acts on its own namespace only, never cluster-wide
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opencode-agent.name" . }}-edit
  namespace: {{ include "opencode-agent.namespace" . }}
  labels:
    app: {{ include "opencode-agent.name" $ }}
    app.kubernetes.io/name: opencode-agent
    app.kubernetes.io/component: server
    {{- include "opencode-agent.commonLabels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- kind: ServiceAccount
  name: {{ include "opencode-agent.serviceAccountName" . }}
  namespace: {{ include "opencode-agent.namespace" . }}
