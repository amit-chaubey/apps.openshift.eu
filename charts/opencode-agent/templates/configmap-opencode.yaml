{{- $config := dict
  "$schema" "https://opencode.ai/config.json"
  "update" "disable"
  "share" "disabled"
  "formatter" true
  "experimental" (dict "todo" true)
  "worktree" (dict "directory" "/workspace/.worktrees")
  "watcher" (dict "ignore" (list "**/node_modules/**" "**/.git/**" "**/.venv/**" "**/dist/**" "**/build/**" "**/.next/**"))
  "instructions" (list "/etc/opencode-agent/instructions.md")
  "plugin" .Values.opencode.plugins
  "mcp" (dict "kubernetes" (dict
    "type" "local"
    "enabled" true
    "command" (list "/tools/kubernetes-mcp-server" "--config" "/etc/opencode-agent/kubernetes-mcp-server.toml" "--disable-multi-cluster")
  ))
-}}
{{- range $k, $v := include "opencode-agent.mcpServers" . | fromJson }}
{{- $_ := set $config.mcp $k $v }}
{{- end }}
{{- with .Values.opencode.disabledProviders }}
{{- $_ := set $config "disabled_providers" . }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opencode-agent.name" . }}-opencode
  namespace: {{ include "opencode-agent.namespace" . }}
  labels:
    app: {{ include "opencode-agent.name" . }}
    app.kubernetes.io/name: opencode-agent
    app.kubernetes.io/component: server
    {{- include "opencode-agent.commonLabels" $ | nindent 4 }}
data:
  opencode.json: |
    {{- mergeOverwrite $config (deepCopy .Values.opencode.config) | toPrettyJson | nindent 4 }}
  instructions.md: |
{{ .Files.Get "files/instructions.md" | indent 4 }}
    {{- if and .Values.a2a.peers .Values.gateway.upstream }}
    ## Other agents

    - `a2a_list_agents` lists the agents of your team that you can call and what they do.
    - `a2a_call` sends one message to one of them and waits for its answer, which can take
      minutes. The other agent does not see this conversation: make the message complete.
    - Only call an agent when the person asked for it or the task clearly needs it, and say
      which agent you called and why. Never put a credential in a message.

    {{- end }}
    ## Person

    - Name: {{ include "opencode-agent.person" . }}
    {{- with .Values.person.email }}
    - Email: {{ . }}
    {{- end }}
    {{- with .Values.person.role }}
    - {{ . }}
    {{- end }}
  # The RoleBinding limits the namespace; the server has no namespace flag
  kubernetes-mcp-server.toml: |
    denied_resources = [
      {group = "", version = "v1", kind = "Secret"},
    ]
  # Copied to ~/.npmrc on every start; read when OpenCode installs plugins
  npmrc: |
    {{- range $scope, $url := .Values.opencode.npmScopes }}
    {{ $scope }}:registry={{ $url }}
    {{- end }}
  init.sh: |
{{ .Files.Get "files/init.sh" | indent 4 }}
  # Writes each mcp.servers credential header from the vault secret files into memory
  mcp-headers.sh: |
    set -eu
    umask 077
    d=/var/run/mcp-headers
    {{- range .Values.mcp.servers }}
    {{- $name := .name }}
    {{- with .auth }}
    {{- $dir := printf "/var/run/vault-secrets/%s" .secretRef }}
    {{- $format := .format | default "basic" }}
    # {{ $name }}
    t={{ $dir }}/{{ .tokenKey }}
    {{- if eq $format "basic" }}
    u={{ $dir }}/{{ .userKey }}
    if [ -s "$t" ] && [ -s "$u" ]; then
      printf 'Basic %s' "$(printf '%s:%s' "$(cat "$u")" "$(cat "$t")" | base64 | tr -d '\n')" > "$d/.tmp"
    {{- else }}
    if [ -s "$t" ]; then
      printf '{{ ternary "Bearer " "" (eq $format "bearer") }}%s' "$(cat "$t")" > "$d/.tmp"
    {{- end }}
      mv "$d/.tmp" "$d/{{ $name }}"
    else
      echo "mcp-headers: no credential files for {{ $name }} yet" >&2
    fi
    {{- end }}
    {{- end }}
  backup-db.sh: |
{{ .Files.Get "files/backup-db.sh" | indent 4 }}
