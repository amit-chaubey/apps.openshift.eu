# Browser UI behind oauth-proxy; the Service kagent renders serves A2A on 8080
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencode-agent.name" . }}-ui
  namespace: {{ include "opencode-agent.namespace" . }}
  labels:
    app: {{ include "opencode-agent.name" $ }}
    app.kubernetes.io/name: opencode-agent
    app.kubernetes.io/component: server
    {{- include "opencode-agent.commonLabels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "opencode-agent.selectorLabels" . | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.oauthProxy.port }}
    targetPort: {{ .Values.oauthProxy.port }}
