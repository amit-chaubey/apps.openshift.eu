apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opencode-agent.name" . }}-token-proxy
  namespace: {{ include "opencode-agent.namespace" . }}
  labels:
    app: {{ include "opencode-agent.name" $ }}
    app.kubernetes.io/name: opencode-agent
    app.kubernetes.io/component: server
    {{- include "opencode-agent.commonLabels" $ | nindent 4 }}
data:
  token-proxy.py: |
{{ .Files.Get "files/token-proxy.py" | indent 4 }}
  ui-proxy.py: |
{{ .Files.Get "files/ui-proxy.py" | indent 4 }}
  {{- $targets := include "opencode-agent.mcpTargets" . }}
  {{- if ne $targets "{}" }}
  # mcp.servers with agentToken: the only URLs the proxy sends the agent token to
  targets.json: {{ $targets | quote }}
  {{- end }}
