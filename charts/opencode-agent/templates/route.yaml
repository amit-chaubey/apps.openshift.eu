apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "opencode-agent.name" . }}
  namespace: {{ include "opencode-agent.namespace" . }}
  labels:
    app: {{ include "opencode-agent.name" . }}
    app.kubernetes.io/name: opencode-agent
    app.kubernetes.io/component: route
    {{- include "opencode-agent.commonLabels" $ | nindent 4 }}
    {{- with .Values.route.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    haproxy.router.openshift.io/timeout: {{ .Values.route.timeout }}
    {{- if and .Values.route.host .Values.route.annotations }}
    {{- toYaml .Values.route.annotations | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.route.host }}
  host: {{ . }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "opencode-agent.name" . }}-ui
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
