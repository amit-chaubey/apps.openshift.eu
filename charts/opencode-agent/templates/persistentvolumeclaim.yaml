apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "opencode-agent.name" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "opencode-agent.name" . }}
    app.kubernetes.io/name: opencode-agent
    app.kubernetes.io/component: storage
    {{- include "opencode-agent.commonLabels" $ | nindent 4 }}
  annotations:
    # sessions and the work tree survive a prune or an Application delete
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - {{ .Values.storage.accessMode }}
  {{- with .Values.storage.className }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
