{{- if include "opencode-agent.ownServiceAccount" . }}
# kagent creates the account named after the Agent; any other name is ours
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "opencode-agent.name" $ }}
    app.kubernetes.io/name: opencode-agent
    app.kubernetes.io/component: server
    {{- include "opencode-agent.commonLabels" $ | nindent 4 }}
    {{- with .Values.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    # OAuth client of the UI login; the redirect goes to the Route
    serviceaccounts.openshift.io/oauth-redirectreference.primary: {{ include "opencode-agent.redirectReference" . | quote }}
{{- end }}
