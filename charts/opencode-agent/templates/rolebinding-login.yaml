{{- if .Values.oauth.allowedGroups }}
# Members of these OpenShift groups pass the login proxy's group check
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  {{- $clusterRole := .Values.oauth.loginClusterRole }}
  # roleRef is immutable: a ClusterRole binding has its own name
  name: {{ include "opencode-agent.name" . }}-{{ ternary "app-login" "login" (not (empty $clusterRole)) }}
  namespace: {{ include "opencode-agent.namespace" . }}
  labels:
    app: {{ include "opencode-agent.name" $ }}
    app.kubernetes.io/name: opencode-agent
    app.kubernetes.io/component: server
    {{- include "opencode-agent.commonLabels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ ternary "ClusterRole" "Role" (not (empty $clusterRole)) }}
  name: {{ default (printf "%s-login" (include "opencode-agent.name" .)) $clusterRole }}
subjects:
{{- range .Values.oauth.allowedGroups }}
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: {{ . }}
{{- end }}
{{- end }}
