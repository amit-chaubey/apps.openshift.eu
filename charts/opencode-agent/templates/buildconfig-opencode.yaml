{{- if .Values.builds.enabled }}
{{- $name := printf "%s-opencode" (include "opencode-agent.name" .) }}
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: {{ $name }}
  namespace: {{ include "opencode-agent.namespace" . }}
  labels:
    app: {{ include "opencode-agent.name" $ }}
    app.kubernetes.io/name: opencode-agent
    app.kubernetes.io/component: build
    {{- include "opencode-agent.commonLabels" $ | nindent 4 }}
spec:
  lookupPolicy:
    local: true
---
# Build context of the opencode image: the tool installer and its check
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-build
  namespace: {{ include "opencode-agent.namespace" . }}
  labels:
    app: {{ include "opencode-agent.name" $ }}
    app.kubernetes.io/name: opencode-agent
    app.kubernetes.io/component: build
    {{- include "opencode-agent.commonLabels" $ | nindent 4 }}
data:
  install-tools.sh: |
{{ .Files.Get "files/install-tools.sh" | indent 4 }}
  verify-tools.sh: |
{{ .Files.Get "files/verify-tools.sh" | indent 4 }}
---
# Adds the toolset to upstream; the name hash makes ConfigChange rebuild on change
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: {{ $name }}-{{ include "opencode-agent.opencodeHash" . }}
  namespace: {{ include "opencode-agent.namespace" . }}
  labels:
    app: {{ include "opencode-agent.name" $ }}
    app.kubernetes.io/name: opencode-agent
    app.kubernetes.io/component: build
    {{- include "opencode-agent.commonLabels" $ | nindent 4 }}
spec:
  runPolicy: Serial
  source:
    type: Dockerfile
    dockerfile: |
      {{- include "opencode-agent.opencodeDockerfile" . | nindent 6 }}
    configMaps:
    - configMap:
        name: {{ $name }}-build
      destinationDir: .
  strategy:
    type: Docker
    dockerStrategy: {}
  output:
    to:
      kind: ImageStreamTag
      name: {{ $name }}:{{ include "opencode-agent.opencodeTag" . }}
  {{- with .Values.builds.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  triggers:
  - type: ConfigChange
  resources:
    {{- toYaml .Values.builds.resources | nindent 4 }}
{{- end }}
