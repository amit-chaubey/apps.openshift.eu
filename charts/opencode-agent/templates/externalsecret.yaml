{{- if eq .Values.secrets.type "externalSecret" }}
{{- $store := required "secrets.externalSecret.storeName is required" .Values.secrets.externalSecret.storeName }}
{{- $name := include "opencode-agent.name" . }}
{{- $items := .Values.secrets.externalSecret.items }}
{{- $secrets := list
  (dict "suffix" "server-password" "item" $items.serverPassword "template" (dict
    "password" "{{ .value }}"
    "oauth-proxy.cfg" "basic_auth_password = {{ .value | toJson }}\n"))
  (dict "suffix" "a2a-auth" "item" $items.a2aToken "template" (dict
    "token" "{{ .value }}"
    "credentials" "[{\"scheme\":\"bearer\",\"token\":\"{{ .value }}\",\"principal\":\"gateway\"}]"))
  (dict "suffix" "cookie-secret" "item" $items.cookieSecret "template" (dict
    "cookie-secret" "{{ .value }}"))
}}
{{- if .Values.git.url }}
{{- $secrets = append $secrets (dict "suffix" "git-token" "item" $items.gitToken "template" (dict "token" "{{ .value }}")) }}
{{- end }}
{{- range $i, $s := $secrets }}
{{- if $i }}
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-{{ $s.suffix }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: opencode-agent
    app.kubernetes.io/component: credentials
    {{- include "opencode-agent.commonLabels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.secrets.externalSecret.storeKind }}
    name: {{ $store }}
  # ESO defaults, spelled out so a GitOps tool sees no drift
  target:
    name: {{ $name }}-{{ $s.suffix }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        {{- toYaml $s.template | nindent 8 }}
  data:
  - secretKey: value
    remoteRef:
      key: {{ default (printf "%s-%s" $name $s.suffix) $s.item }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- end }}
{{- end }}
