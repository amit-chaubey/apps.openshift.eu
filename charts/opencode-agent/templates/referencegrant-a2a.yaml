{{- with .Values.a2a.gatewayNamespace }}
# HTTPRoutes of the gateway namespace may reach this agent's A2A Service only
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ include "opencode-agent.name" $ }}-a2a
  namespace: {{ include "opencode-agent.namespace" $ }}
  labels:
    app: {{ include "opencode-agent.name" $ }}
    app.kubernetes.io/name: opencode-agent
    app.kubernetes.io/component: server
    {{- include "opencode-agent.commonLabels" $ | nindent 4 }}
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: {{ . }}
  to:
  - group: ""
    kind: Service
    name: {{ include "opencode-agent.name" $ }}
{{- end }}
