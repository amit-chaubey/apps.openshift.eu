{{- $name := include "opencode-agent.name" . }}
{{- $default := .Values.secrets.externalSecret }}
{{- range $i, $v := .Values.vaultSecrets }}
{{- $secret := printf "%s-%s" $name (required "vaultSecrets[].name is required" $v.name) }}
{{- if not $v.data }}{{ fail (printf "vaultSecrets %s: data is required" $v.name) }}{{ end }}
{{- if $i }}
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret }}
  namespace: {{ include "opencode-agent.namespace" $ }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: opencode-agent
    app.kubernetes.io/component: credentials
    {{- include "opencode-agent.commonLabels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $v.refreshInterval | default $default.refreshInterval }}
  secretStoreRef:
    kind: {{ $v.storeKind | default $default.storeKind }}
    name: {{ $v.storeName | default $default.storeName | required (printf "vaultSecrets %s: storeName or secrets.externalSecret.storeName is required" $v.name) }}
  # ESO defaults, spelled out so a GitOps tool sees no drift
  target:
    name: {{ $secret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  {{- range $key, $property := $v.data }}
  - secretKey: {{ $key }}
    remoteRef:
      key: {{ $v.item | default $secret }}
      property: {{ $property }}
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  {{- end }}
{{- end }}
