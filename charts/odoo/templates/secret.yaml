{{- if eq .Values.secrets.type "kubernetes" }}
{{- $found := lookup "v1" "Secret" .Release.Namespace "odoo-credentials" }}
{{- $existing := dict }}
{{- if $found }}{{- $existing = $found.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: odoo-credentials
  labels:
    {{- include "odoo.labels" (dict "root" $ "component" "credentials") | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.adminPassword }}
  admin-password: {{ .Values.secrets.adminPassword | b64enc | quote }}
  {{- else if hasKey $existing "admin-password" }}
  admin-password: {{ index $existing "admin-password" | quote }}
  {{- else }}
  admin-password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.masterPassword }}
  master-password: {{ .Values.secrets.masterPassword | b64enc | quote }}
  {{- else if hasKey $existing "master-password" }}
  master-password: {{ index $existing "master-password" | quote }}
  {{- else }}
  master-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- else }}
{{- $es := .Values.secrets.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: odoo-credentials
  labels:
    {{- include "odoo.labels" (dict "root" $ "component" "credentials") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ required "secrets.externalSecret.storeName is required" $es.storeName }}
  target:
    name: odoo-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  {{- range $key, $item := $es.items }}
  - secretKey: {{ $key }}
    remoteRef:
      key: {{ $item }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  {{- end }}
{{- end }}
