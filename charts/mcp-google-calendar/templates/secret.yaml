{{- $secret := include "mcp-google-calendar.clientSecret" . }}
{{- $s := .Values.secrets }}
{{- if and .Values.oauthClient.create (not .Values.oauthClient.existingSecret) }}
{{- if eq $s.type "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret }}
  namespace: {{ include "mcp-google-calendar.namespace" . }}
  labels:
    app: {{ include "mcp-google-calendar.name" . }}
    app.kubernetes.io/name: mcp-google-calendar
    app.kubernetes.io/component: credentials
    {{- include "mcp-google-calendar.commonLabels" . | nindent 4 }}
spec:
  refreshInterval: {{ $s.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ $s.externalSecret.storeKind }}
    name: {{ required "secrets.externalSecret.storeName is required" $s.externalSecret.storeName }}
  # ESO defaults, spelled out so a GitOps tool sees no drift
  target:
    name: {{ $secret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  {{- range $key, $property := dict "client_id" "login.username" "client_secret" "login.password" }}
  - secretKey: {{ $key }}
    remoteRef:
      key: {{ default $secret $s.externalSecret.item }}
      property: {{ $property }}
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  {{- end }}
{{- else if $s.clientId }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ include "mcp-google-calendar.namespace" . }}
  labels:
    app: {{ include "mcp-google-calendar.name" . }}
    app.kubernetes.io/name: mcp-google-calendar
    app.kubernetes.io/component: credentials
    {{- include "mcp-google-calendar.commonLabels" . | nindent 4 }}
type: Opaque
data:
  client_id: {{ $s.clientId | b64enc | quote }}
  client_secret: {{ $s.clientSecret | b64enc | quote }}
{{- end }}
{{- end }}
