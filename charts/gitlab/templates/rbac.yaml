# service accounts the operator expects in the project of the instance
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-app-nonroot
  labels:
    app: gitlab
    app.kubernetes.io/name: gitlab
    app.kubernetes.io/component: rbac
    {{- include "gitlab.commonLabels" $ | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-manager
  labels:
    app: gitlab
    app.kubernetes.io/name: gitlab
    app.kubernetes.io/component: rbac
    {{- include "gitlab.commonLabels" $ | nindent 4 }}
---
# the operator's Job that generates the internal secrets runs as gitlab-manager
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-manager
  labels:
    app: gitlab
    app.kubernetes.io/name: gitlab
    app.kubernetes.io/component: rbac
    {{- include "gitlab.commonLabels" $ | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-manager
  labels:
    app: gitlab
    app.kubernetes.io/name: gitlab
    app.kubernetes.io/component: rbac
    {{- include "gitlab.commonLabels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-manager
subjects:
- kind: ServiceAccount
  name: gitlab-manager
