apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-valkey
  labels:
    app: gitlab-valkey
    app.kubernetes.io/name: gitlab-valkey
    app.kubernetes.io/component: cache
    {{- include "gitlab.commonLabels" $ | nindent 4 }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.valkey.size }}
{{- if .Values.storageClassName }}
  storageClassName: {{ .Values.storageClassName }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-valkey
  labels:
    app: gitlab-valkey
    app.kubernetes.io/name: gitlab-valkey
    app.kubernetes.io/component: cache
    {{- include "gitlab.commonLabels" $ | nindent 4 }}
    app.openshift.io/runtime: redis
  annotations:
    app.openshift.io/vcs-uri: https://github.com/valkey-io/valkey
spec:
  replicas: 1
  # the data volume is ReadWriteOnce: the old pod must release it first
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitlab-valkey
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: valkey
        image: {{ .Values.valkey.image }}
        args:
        - --requirepass
        - $(VALKEY_PASSWORD)
        - --appendonly
        - "yes"
        - --dir
        - /data
        ports:
        - name: valkey
          containerPort: 6379
        env:
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gitlab-credentials
              key: valkey-password
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          tcpSocket:
            port: valkey
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: valkey
          periodSeconds: 30
          failureThreshold: 6
        resources:
          {{- toYaml .Values.valkey.resources | nindent 10 }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: gitlab-valkey
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-valkey
  labels:
    app: gitlab-valkey
    app.kubernetes.io/name: gitlab-valkey
    app.kubernetes.io/component: cache
    {{- include "gitlab.commonLabels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: gitlab-valkey
  ports:
  - name: valkey
    port: 6379
    targetPort: valkey
