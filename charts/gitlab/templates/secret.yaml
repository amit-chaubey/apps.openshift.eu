{{- if eq .Values.secrets.type "kubernetes" }}
{{- $found := lookup "v1" "Secret" .Release.Namespace "gitlab-credentials" }}
{{- $existing := dict }}
{{- if $found }}{{- $existing = $found.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-credentials
  labels:
    {{- include "instance.labels" (dict "root" $ "component" "credentials") | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.rootPassword }}
  root-password: {{ .Values.secrets.rootPassword | b64enc | quote }}
  {{- else if hasKey $existing "root-password" }}
  root-password: {{ index $existing "root-password" | quote }}
  {{- else }}
  root-password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.valkeyPassword }}
  valkey-password: {{ .Values.secrets.valkeyPassword | b64enc | quote }}
  {{- else if hasKey $existing "valkey-password" }}
  valkey-password: {{ index $existing "valkey-password" | quote }}
  {{- else }}
  valkey-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- else }}
{{- $es := .Values.secrets.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-credentials
  labels:
    {{- include "instance.labels" (dict "root" $ "component" "credentials") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ required "secrets.externalSecret.storeName is required" $es.storeName }}
  target:
    name: gitlab-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  {{- range $key, $item := $es.items }}
  - secretKey: {{ $key }}
    remoteRef:
      key: {{ $item }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  {{- end }}
{{- end }}
