{{- if eq .Values.secrets.type "kubernetes" }}
{{- $name := include "oh-my-openagent.name" . }}
{{- $existing := include "oh-my-openagent.existing" (dict "root" . "name" (printf "%s-cookie-secret" $name)) | fromJson }}
{{- /* oauth-proxy accepts 16, 24 or 32 bytes: a value of another length is hashed to 32 */}}
{{- $cookie := .Values.secrets.cookieSecret }}
{{- if and $cookie (not (has (len $cookie) (list 16 24 32))) }}
{{- $cookie = $cookie | sha256sum | trunc 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-cookie-secret
  namespace: {{ include "oh-my-openagent.namespace" . }}
  labels:
    {{- include "oh-my-openagent.labels" (dict "root" . "component" "credentials") | nindent 4 }}
type: Opaque
data:
  cookie-secret: {{ include "oh-my-openagent.secretValue" (dict "value" $cookie "existing" $existing "key" "cookie-secret" "length" 32) | b64enc | quote }}
{{- if eq .Values.gateway.auth "apiKey" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-gateway-api-key
  namespace: {{ include "oh-my-openagent.namespace" . }}
  labels:
    {{- include "oh-my-openagent.labels" (dict "root" . "component" "credentials") | nindent 4 }}
type: Opaque
data:
  api-key: {{ required "secrets.gatewayApiKey is required with gateway.auth apiKey" .Values.secrets.gatewayApiKey | b64enc | quote }}
{{- end }}
{{- end }}
