apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "oh-my-openagent.name" . }}
  namespace: {{ include "oh-my-openagent.namespace" . }}
  labels:
    {{- include "oh-my-openagent.labels" (dict "root" . "component" "route") | nindent 4 }}
    {{- with .Values.route.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    haproxy.router.openshift.io/timeout: {{ .Values.route.timeout }}
    # the terminal is a WebSocket; an idle tunnel stays open this long
    haproxy.router.openshift.io/timeout-tunnel: {{ .Values.route.tunnelTimeout }}
    {{- if and .Values.route.host .Values.route.annotations }}
    {{- toYaml .Values.route.annotations | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.route.host }}
  host: {{ . }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "oh-my-openagent.name" . }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
