apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "oh-my-openagent.name" . }}-home
  namespace: {{ include "oh-my-openagent.namespace" . }}
  labels:
    {{- include "oh-my-openagent.labels" (dict "root" . "component" "storage") | nindent 4 }}
  annotations:
    # sessions, logins and the work tree survive a prune or an Application delete
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - {{ .Values.storage.accessMode }}
  {{- with .Values.storage.className }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
