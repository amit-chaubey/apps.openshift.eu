{{- if eq .Values.secrets.type "externalSecret" }}
{{- $es := .Values.secrets.externalSecret }}
{{- $store := required "secrets.externalSecret.storeName is required" $es.storeName }}
{{- $name := include "oh-my-openagent.name" . }}
{{- /* oauth-proxy accepts 16, 24 or 32 bytes: a vault value of another length is hashed to 32 */}}
{{- $cookie := `{{ $v := .value }}{{ if has (len $v) (list 16 24 32) }}{{ $v }}{{ else }}{{ $v | sha256sum | trunc 32 }}{{ end }}` }}
{{- $secrets := list (dict "suffix" "cookie-secret" "item" $es.items.cookieSecret "key" "cookie-secret" "template" $cookie) }}
{{- if eq .Values.gateway.auth "apiKey" }}
{{- $secrets = append $secrets (dict "suffix" "gateway-api-key" "item" $es.items.gatewayApiKey "key" "api-key" "template" `{{ .value }}`) }}
{{- end }}
{{- range $i, $s := $secrets }}
{{- if $i }}
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-{{ $s.suffix }}
  namespace: {{ include "oh-my-openagent.namespace" $ }}
  labels:
    {{- include "oh-my-openagent.labels" (dict "root" $ "component" "credentials") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ $store }}
  # ESO defaults, spelled out so a GitOps tool sees no drift
  target:
    name: {{ $name }}-{{ $s.suffix }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        {{ $s.key }}: {{ $s.template | quote }}
  data:
  - secretKey: value
    remoteRef:
      key: {{ default (printf "%s-%s" $name $s.suffix) $s.item }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- end }}
{{- end }}
