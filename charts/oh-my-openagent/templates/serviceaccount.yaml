apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "oh-my-openagent.name" . }}
  namespace: {{ include "oh-my-openagent.namespace" . }}
  labels:
    {{- include "oh-my-openagent.labels" (dict "root" . "component" "server") | nindent 4 }}
  annotations:
    # OAuth client of the login; the redirect goes to the Route
    serviceaccounts.openshift.io/oauth-redirectreference.primary: {{ include "oh-my-openagent.redirectReference" . | quote }}
