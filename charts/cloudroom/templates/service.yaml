apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudroom.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "cloudroom.name" . }}
    app.kubernetes.io/name: cloudroom
    app.kubernetes.io/component: server
    {{- include "cloudroom.commonLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "cloudroom.selectorLabels" . | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.port }}
    targetPort: http
    protocol: TCP
