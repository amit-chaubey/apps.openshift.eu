{{- $secret := include "cloudroom.tokenSecret" . }}
{{- if eq .Values.secrets.type "externalSecret" }}
{{- $es := .Values.secrets.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "cloudroom.name" . }}
    app.kubernetes.io/name: cloudroom
    app.kubernetes.io/component: credentials
    {{- include "cloudroom.commonLabels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ required "secrets.externalSecret.storeName is required" $es.storeName }}
  # ESO defaults, spelled out so a GitOps tool sees no drift
  target:
    name: {{ $secret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: token
    remoteRef:
      key: {{ default $secret $es.items.token }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- else }}
{{- $token := .Values.secrets.token }}
{{- if not $token }}
{{- $found := lookup "v1" "Secret" .Release.Namespace $secret }}
{{- if and $found $found.data (hasKey $found.data "token") }}
{{- $token = index $found.data "token" | b64dec }}
{{- else }}
{{- $token = randAlphaNum 64 }}
{{- end }}
{{- end }}
{{- if lt (len $token) 32 }}
{{- fail "secrets.token must be at least 32 characters long" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "cloudroom.name" . }}
    app.kubernetes.io/name: cloudroom
    app.kubernetes.io/component: credentials
    {{- include "cloudroom.commonLabels" . | nindent 4 }}
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
{{- end }}
