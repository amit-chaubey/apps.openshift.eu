# Identity of the token proxy at the gateway; the core container gets no token
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cloudroom.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "cloudroom.name" . }}
    app.kubernetes.io/name: cloudroom
    app.kubernetes.io/component: server
    {{- include "cloudroom.commonLabels" . | nindent 4 }}
automountServiceAccountToken: false
