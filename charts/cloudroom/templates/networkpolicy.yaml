{{- if .Values.networkPolicy.enabled }}
# The core serves plain HTTP: only the router reaches its port
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cloudroom.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "cloudroom.name" . }}
    app.kubernetes.io/name: cloudroom
    app.kubernetes.io/component: server
    {{- include "cloudroom.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cloudroom.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: {{ .Values.port }}
    from:
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/ingress: ""
    # a HostNetwork router sends from the node network
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/host-network: ""
{{- end }}
