{{- if and .Values.enabled .Values.auth.enabled (not .Values.auth.existingSecret) }}
# Cookie and client secret of the token check, generated once and kept on upgrade
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-auth.secretName" (dict "root" . "name" (include "mcp-slack.name" .)) }}
  namespace: {{ include "mcp-slack.namespace" . }}
  labels:
    app: {{ include "mcp-slack.name" . }}
    app.kubernetes.io/name: mcp-slack
    app.kubernetes.io/component: credentials
    {{- include "mcp-slack.commonLabels" . | nindent 4 }}
type: Opaque
data:
  {{- include "mcp-auth.secretData" (dict "root" . "name" (include "mcp-slack.name" .) "namespace" (include "mcp-slack.namespace" .)) | nindent 2 }}
{{- end }}
