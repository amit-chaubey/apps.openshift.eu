{{- if and .Values.enabled .Values.networkPolicy.enabled }}
# Callers: the own project and the listed namespaces (an MCP gateway, the router). The server
# reaches DNS and its own project, where Nextcloud runs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-nextcloud.name" . }}
  namespace: {{ include "mcp-nextcloud.namespace" . }}
  labels:
    app: {{ include "mcp-nextcloud.name" . }}
    app.kubernetes.io/name: mcp-nextcloud
    app.kubernetes.io/component: server
    {{- include "mcp-nextcloud.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-nextcloud.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  {{- if .Values.networkPolicy.egress.enabled }}
  - Egress
  {{- end }}
  ingress:
  - ports:
    - protocol: TCP
      port: {{ .Values.port }}
    from:
    - podSelector: {}
    {{- range .Values.networkPolicy.ingressNamespaces }}
    - namespaceSelector:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  {{- with .Values.networkPolicy.egress }}
  {{- if .enabled }}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .dnsNamespace }}
    ports:
    - protocol: UDP
      port: {{ .dnsPort }}
    - protocol: TCP
      port: {{ .dnsPort }}
  - to:
    - podSelector: {}
  {{- end }}
  {{- end }}
{{- end }}
