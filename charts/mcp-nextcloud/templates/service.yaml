{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-nextcloud.name" . }}
  namespace: {{ include "mcp-nextcloud.namespace" . }}
  labels:
    app: {{ include "mcp-nextcloud.name" . }}
    app.kubernetes.io/name: mcp-nextcloud
    app.kubernetes.io/component: server
    {{- include "mcp-nextcloud.commonLabels" . | nindent 4 }}
    {{- include "mcp-nextcloud.catalogLabels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    agentgateway.dev/mcp-path: {{ .Values.path | quote }}
    agentgateway.dev/mcp-target-name: {{ .Values.mcp.server | quote }}
spec:
  type: ClusterIP
  selector:
    {{- include "mcp-nextcloud.selectorLabels" . | nindent 4 }}
  ports:
  - name: mcp
    port: {{ .Values.port }}
    targetPort: mcp
    protocol: TCP
    {{- with .Values.mcp.appProtocol }}
    appProtocol: {{ . }}
    {{- end }}
{{- end }}
