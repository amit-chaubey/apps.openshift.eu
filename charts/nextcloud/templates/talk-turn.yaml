{{- if and .Values.talk.enabled .Values.talk.turn.enabled }}
{{- $turn := .Values.talk.turn }}
{{- $host := include "wrapper.turnHost" . }}
{{- $type := ternary "LoadBalancer" $turn.service.type $turn.public }}
{{- $annotations := deepCopy $turn.service.annotations }}
{{- if $turn.public }}
{{- $annotations = merge $annotations (include "wrapper.publicAddress" . | fromYaml) }}
{{- $_ := set $annotations "external-dns.alpha.kubernetes.io/hostname" $host }}
{{- $_ := set $annotations "external-dns.kubernetes.io/hostname" $host }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-turn
  {{- with include "wrapper.topologyAnnotations" "nextcloud-turn" }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "wrapper.labels" "nextcloud-turn" | nindent 4 }}
    {{- include "wrapper.topologyLabels" "nextcloud-turn" | nindent 4 }}
    {{- include "wrapper.objectLabels" (dict "root" $ "app" "nextcloud-turn" "component" "turn" "skip" (list "app.kubernetes.io/name" "app.kubernetes.io/part-of")) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "wrapper.labels" "nextcloud-turn" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wrapper.labels" "nextcloud-turn" | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: coturn
        image: {{ $turn.image }}
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        {{- if $turn.externalIP }}
        - exec turnserver "$@" --external-ip={{ $turn.externalIP }}
        {{- else if $turn.public }}
        # the public address is that of the DNS name; a change restarts coturn
        - |
          resolve() { getent ahostsv4 {{ $host }} | awk '{print $1; exit}'; }
          trap 'kill $pid 2>/dev/null; exit 0' TERM INT
          while true; do
            ip=$(resolve)
            if [ -z "$ip" ]; then echo "waiting for {{ $host }}"; sleep 10; continue; fi
            echo "external address $ip, pod address $POD_IP"
            turnserver "$@" --external-ip=$ip/$POD_IP &
            pid=$!
            while kill -0 $pid 2>/dev/null; do
              sleep 60 & wait $!
              new=$(resolve)
              if [ -n "$new" ] && [ "$new" != "$ip" ]; then echo "address changed to $new"; kill $pid; fi
            done
          done
        {{- else }}
        - exec turnserver "$@"
        {{- end }}
        - turnserver
        args:
        - -n
        - --log-file=stdout
        - --pidfile=/var/tmp/turnserver.pid
        - --userdb=/var/tmp/turndb
        - --fingerprint
        - --no-cli
        - --no-software-attribute
        - --use-auth-secret
        - --static-auth-secret=$(TURN_SECRET)
        - --realm={{ $turn.realm | default $host }}
        - --listening-port={{ $turn.port }}
        - --min-port={{ $turn.relayPorts.min }}
        - --max-port={{ $turn.relayPorts.max }}
        {{- if $turn.tls.enabled }}
        - --tls-listening-port={{ $turn.tls.port }}
        - --cert=/tls/tls.crt
        - --pkey=/tls/tls.key
        {{- else }}
        - --no-tls
        - --no-dtls
        {{- end }}
        env:
        - name: TURN_SECRET
          valueFrom:
            secretKeyRef:
              name: nextcloud-talk
              key: turn-secret
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - name: turn-tcp
          containerPort: {{ $turn.port }}
          protocol: TCP
        - name: turn-udp
          containerPort: {{ $turn.port }}
          protocol: UDP
        livenessProbe:
          tcpSocket:
            port: turn-tcp
          initialDelaySeconds: 30
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: turn-tcp
        resources:
          {{- toYaml $turn.resources | nindent 10 }}
        # the binary carries this file capability and does not start without
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /var/tmp
        {{- if $turn.tls.enabled }}
        - name: tls
          mountPath: /tls
          readOnly: true
        {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
      {{- if $turn.tls.enabled }}
      - name: tls
        secret:
          secretName: nextcloud-turn-tls
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-turn
  labels:
    {{- include "wrapper.labels" "nextcloud-turn" | nindent 4 }}
    {{- include "wrapper.objectLabels" (dict "root" $ "app" "nextcloud-turn" "component" "turn" "skip" (list "app.kubernetes.io/name")) | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $type }}
  {{- if ne $type "ClusterIP" }}
  externalTrafficPolicy: {{ include "wrapper.trafficPolicy" (dict "root" . "policy" $turn.service.externalTrafficPolicy) }}
  {{- end }}
  ports:
  - name: turn-tcp
    port: {{ $turn.port }}
    targetPort: {{ $turn.port }}
    protocol: TCP
  - name: turn-udp
    port: {{ $turn.port }}
    targetPort: {{ $turn.port }}
    protocol: UDP
  {{- if $turn.tls.enabled }}
  - name: turns-tcp
    port: {{ $turn.tls.port }}
    targetPort: {{ $turn.tls.port }}
    protocol: TCP
  - name: turns-udp
    port: {{ $turn.tls.port }}
    targetPort: {{ $turn.tls.port }}
    protocol: UDP
  {{- end }}
  {{- range $port := untilStep (int $turn.relayPorts.min) (int (add1 $turn.relayPorts.max)) 1 }}
  - name: relay-{{ $port }}
    port: {{ $port }}
    targetPort: {{ $port }}
    protocol: UDP
  {{- end }}
  selector:
    {{- include "wrapper.labels" "nextcloud-turn" | nindent 4 }}
{{- if ne $type "ClusterIP" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextcloud-turn
  labels:
    {{- include "wrapper.objectLabels" (dict "root" $ "app" "nextcloud-turn" "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "wrapper.labels" "nextcloud-turn" | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - port: {{ $turn.port }}
      protocol: TCP
    - port: {{ $turn.port }}
      protocol: UDP
    {{- if $turn.tls.enabled }}
    - port: {{ $turn.tls.port }}
      protocol: TCP
    - port: {{ $turn.tls.port }}
      protocol: UDP
    {{- end }}
    - port: {{ $turn.relayPorts.min }}
      endPort: {{ $turn.relayPorts.max }}
      protocol: UDP
{{- end }}
{{- if $turn.tls.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nextcloud-turn
  labels:
    {{- include "wrapper.objectLabels" (dict "root" $ "app" "nextcloud-turn" "component" "certificate") | nindent 4 }}
spec:
  secretName: nextcloud-turn-tls
  dnsNames:
  - {{ $host }}
  issuerRef:
    group: cert-manager.io
    kind: {{ $turn.tls.issuerKind }}
    name: {{ $turn.tls.issuerName }}
  usages:
  - digital signature
  - key encipherment
{{- end }}
{{- end }}
