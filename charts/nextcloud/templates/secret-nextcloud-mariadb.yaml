{{- if and (eq .Values.secrets.type "kubernetes") (not .Values.secrets.generator.enabled) }}
{{- $old := include "wrapper.existingData" (dict "namespace" .Release.Namespace "name" "nextcloud-credentials") | fromJson }}
{{- $root := dict "name" "nextcloud-mariadb-root" "key" "password" "value" .Values.secrets.mariadbRootPassword "oldKey" "mariadb-root-password" "user" false }}
{{- if include "wrapper.legacyRootSecret" . }}
{{- $root = dict "name" "nextcloud-credentials" "key" "mariadb-root-password" "value" .Values.secrets.mariadbRootPassword "oldKey" "mariadb-root-password" "user" false }}
{{- end }}
{{- $user := dict "name" "nextcloud-mariadb" "key" "password" "value" .Values.secrets.mariadbPassword "oldKey" "mariadb-password" "user" true }}
{{- range $c := list $user $root }}
{{- $existing := include "wrapper.existingData" (dict "namespace" $.Release.Namespace "name" $c.name) | fromJson }}
{{- /* up to 0.5: one Secret nextcloud-credentials */ -}}
{{- if and (not (hasKey $existing $c.key)) (hasKey $old $c.oldKey) }}
{{- $_ := set $existing $c.key (index $old $c.oldKey) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $c.name }}
  labels:
    app: nextcloud-mariadb
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: nextcloud
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  {{- if $c.user }}
  username: {{ "nextcloud" | b64enc | quote }}
  {{- end }}
  {{ $c.key }}: {{ include "wrapper.secretValue" (dict "value" $c.value "existing" $existing "key" $c.key "length" 32) | quote }}
{{- end }}
{{- end }}
