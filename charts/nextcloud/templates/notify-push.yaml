{{- if .Values.notifyPush.enabled }}
{{- $db := .Values.nextcloud.externalDatabase }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-notify-push
  {{- with include "wrapper.topologyAnnotations" "nextcloud-notify-push" }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "wrapper.labels" "nextcloud-notify-push" | nindent 4 }}
    {{- include "wrapper.topologyLabels" "nextcloud-notify-push" | nindent 4 }}
    {{- include "wrapper.objectLabels" (dict "root" $ "app" "nextcloud-notify-push" "component" "push" "skip" (list "app.kubernetes.io/name" "app.kubernetes.io/part-of")) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wrapper.labels" "nextcloud-notify-push" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wrapper.labels" "nextcloud-notify-push" | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      affinity:
        {{- include "wrapper.sameNode" . | nindent 8 }}
      containers:
      - name: notify-push
        image: {{ include "wrapper.nextcloudImage" . }}
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        # the binary arrives when Nextcloud has installed the notify_push app
        - |
          bin=/custom_apps/notify_push/bin/$(uname -m)/notify_push
          until [ -x "$bin" ]; do echo "waiting for $bin"; sleep 10; done
          exec "$bin" --port 7867 --metrics-port 9867
        env:
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: nextcloud-credentials
              key: mariadb-username
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nextcloud-credentials
              key: mariadb-password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nextcloud-redis
              key: redis-password
        - name: DATABASE_URL
          value: mysql://$(DATABASE_USER):$(DATABASE_PASSWORD)@{{ $db.host }}/{{ $db.database }}
        - name: REDIS_URL
          value: redis://:$(REDIS_PASSWORD)@nextcloud-redis:6379
        - name: NEXTCLOUD_URL
          value: {{ include "wrapper.internalUrl" . }}
        ports:
        - name: push
          containerPort: 7867
          protocol: TCP
        - name: metrics
          containerPort: 9867
          protocol: TCP
        startupProbe:
          tcpSocket:
            port: push
          periodSeconds: 10
          failureThreshold: 90
        livenessProbe:
          tcpSocket:
            port: push
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: push
          periodSeconds: 10
          failureThreshold: 3
        resources:
          {{- toYaml .Values.notifyPush.resources | nindent 10 }}
        # the UID of the files of Nextcloud
        securityContext:
          runAsUser: 33
          runAsGroup: 33
          {{- include "wrapper.restricted" . | nindent 10 }}
        volumeMounts:
        - name: nextcloud-main
          mountPath: /custom_apps
          subPath: custom_apps
          readOnly: true
      volumes:
      - name: nextcloud-main
        persistentVolumeClaim:
          claimName: nextcloud-nextcloud
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-notify-push
  labels:
    {{- include "wrapper.labels" "nextcloud-notify-push" | nindent 4 }}
    {{- include "wrapper.objectLabels" (dict "root" $ "app" "nextcloud-notify-push" "component" "push" "skip" (list "app.kubernetes.io/name")) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: push
    port: 7867
    targetPort: push
    protocol: TCP
  - name: metrics
    port: 9867
    targetPort: metrics
    protocol: TCP
  selector:
    {{- include "wrapper.labels" "nextcloud-notify-push" | nindent 4 }}
---
{{ include "wrapper.pathRoute" (dict "root" . "name" "nextcloud-notify-push" "path" "/push" "port" "push") }}
{{- end }}
