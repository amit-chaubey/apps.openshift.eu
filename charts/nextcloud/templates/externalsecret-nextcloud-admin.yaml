{{- /*
One credentials Secret made by External Secrets: read from a vault item (secrets.type
externalSecret) or generated once (secrets.generator.enabled).
*/ -}}
{{- define "wrapper.credentialsExternalSecret" -}}
{{- $ := .root }}
{{- $es := $.Values.secrets.externalSecret }}
{{- $generate := and .generator (not .value) }}
{{- if $generate }}
# letters and digits only: a database password is used inside a URL
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app: {{ .app }}
    app.kubernetes.io/name: {{ .product }}
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: nextcloud
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
spec:
  length: {{ .length }}
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  {{- if .generator }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  {{- end }}
  labels:
    app: {{ .app }}
    app.kubernetes.io/name: {{ .product }}
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: nextcloud
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
spec:
  {{- if .generator }}
  # immutable, or a second reconcile at creation writes a new password
  refreshPolicy: CreatedOnce
  {{- else }}
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ required "secrets.externalSecret.storeName is required" $es.storeName }}
  {{- end }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    {{- if .generator }}
    immutable: true
    {{- end }}
    template:
      engineVersion: v2
      {{- if or .labels .annotations }}
      metadata:
        {{- with .labels }}
        labels:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      data:
        {{- with .user }}
        username: {{ . | quote }}
        {{- end }}
        {{- if and .generator .value }}
        password: {{ .value | quote }}
        {{- else }}
        password: {{ "{{ .password }}" | quote }}
        {{- end }}
  {{- if $generate }}
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: {{ .name }}
  {{- else if not .generator }}
  data:
  - secretKey: password
    remoteRef:
      key: {{ index $es.items .item }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  {{- end }}
{{- end -}}

{{- $s := .Values.secrets }}
{{- $vault := eq $s.type "externalSecret" }}
{{- $generator := and (eq $s.type "kubernetes") $s.generator.enabled }}
{{- if or $vault $generator }}
{{- if include "wrapper.legacyRootSecret" . }}
{{- fail "database.legacyRootSecret works with secrets.type kubernetes and the generator off only" }}
{{- end }}
{{ include "wrapper.credentialsExternalSecret" (dict "root" $ "name" "nextcloud-admin" "app" "nextcloud" "product" "nextcloud" "user" $s.adminUsername "value" $s.adminPassword "item" "nextcloud-password" "length" 24 "generator" $generator "labels" $s.generator.secretTemplate.labels "annotations" $s.generator.secretTemplate.annotations) }}
---
{{ include "wrapper.credentialsExternalSecret" (dict "root" $ "name" "nextcloud-mariadb" "app" "nextcloud-mariadb" "product" "mariadb" "user" "nextcloud" "value" $s.mariadbPassword "item" "mariadb-password" "length" 32 "generator" $generator) }}
---
{{ include "wrapper.credentialsExternalSecret" (dict "root" $ "name" "nextcloud-mariadb-root" "app" "nextcloud-mariadb" "product" "mariadb" "user" "" "value" $s.mariadbRootPassword "item" "mariadb-root-password" "length" 32 "generator" $generator) }}
{{- end }}
