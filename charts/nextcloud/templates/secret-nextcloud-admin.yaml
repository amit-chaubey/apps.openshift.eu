{{- if and (eq .Values.secrets.type "kubernetes") (not .Values.secrets.generator.enabled) }}
{{- $existing := include "wrapper.existingData" (dict "namespace" .Release.Namespace "name" "nextcloud-admin") | fromJson }}
{{- $old := include "wrapper.existingData" (dict "namespace" .Release.Namespace "name" "nextcloud-credentials") | fromJson }}
{{- /* up to 0.5: one Secret nextcloud-credentials */ -}}
{{- if and (not (hasKey $existing "password")) (hasKey $old "nextcloud-password") }}
{{- $_ := set $existing "password" (index $old "nextcloud-password") }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-admin
  labels:
    app: nextcloud
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: nextcloud
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.secrets.adminUsername | b64enc | quote }}
  password: {{ include "wrapper.secretValue" (dict "value" .Values.secrets.adminPassword "existing" $existing "key" "password" "length" 24) | quote }}
{{- end }}
