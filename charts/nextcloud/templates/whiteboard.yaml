{{- if .Values.whiteboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-whiteboard
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"nextcloud"},{"apiVersion":"apps/v1","kind":"Deployment","name":"nextcloud-redis"}]'
    app.openshift.io/custom-icon: https://raw.githubusercontent.com/nextcloud/promo/master/nextcloud-icon.svg
    app.openshift.io/vcs-uri: https://github.com/nextcloud/whiteboard
  labels:
    app: nextcloud-whiteboard
    app.kubernetes.io/name: nextcloud-whiteboard
    app.kubernetes.io/instance: nextcloud-whiteboard
    app.kubernetes.io/component: whiteboard
    app.kubernetes.io/part-of: nextcloud-office
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
    app.openshift.io/runtime: nodejs
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "wrapper.labels" "nextcloud-whiteboard" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wrapper.labels" "nextcloud-whiteboard" | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: whiteboard
        image: {{ .Values.whiteboard.image }}
        imagePullPolicy: IfNotPresent
        env:
        - name: BACKUP_DIR
          value: /tmp
        - name: STORAGE_STRATEGY
          value: redis
        - name: NEXTCLOUD_URL
          value: https://{{ include "wrapper.host" . }}
        - name: REDIS_HOST
          value: nextcloud-redis
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nextcloud-redis
              key: redis-password
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: nextcloud-whiteboard
              key: whiteboard-jwt-secret
        ports:
        - name: http
          containerPort: 3002
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
        resources:
          {{- toYaml .Values.whiteboard.resources | nindent 10 }}
        securityContext:
          {{- include "wrapper.restricted" . | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-whiteboard
  labels:
    app: nextcloud-whiteboard
    app.kubernetes.io/name: nextcloud-whiteboard
    app.kubernetes.io/instance: nextcloud-whiteboard
    app.kubernetes.io/component: whiteboard
    app.kubernetes.io/part-of: nextcloud-office
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3002
    targetPort: http
    protocol: TCP
  selector:
    {{- include "wrapper.labels" "nextcloud-whiteboard" | nindent 4 }}
---
{{ include "wrapper.pathRoute" (dict "root" . "name" "nextcloud-whiteboard" "partOf" "nextcloud-office" "path" "/whiteboard" "port" "http") }}
{{- end }}
