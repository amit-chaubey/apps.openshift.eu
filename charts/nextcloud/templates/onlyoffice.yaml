{{- if .Values.onlyoffice.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlyoffice
  annotations:
    app.openshift.io/custom-icon: https://avatars.githubusercontent.com/ONLYOFFICE
    app.openshift.io/vcs-uri: https://github.com/ONLYOFFICE/DocumentServer
  labels:
    app: onlyoffice
    app.kubernetes.io/name: onlyoffice
    app.kubernetes.io/instance: onlyoffice
    app.kubernetes.io/component: office
    app.kubernetes.io/part-of: nextcloud-office
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
    app.openshift.io/runtime: nodejs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: onlyoffice
      app.kubernetes.io/instance: onlyoffice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onlyoffice
        app.kubernetes.io/instance: onlyoffice
    spec:
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      containers:
      - name: onlyoffice
        image: {{ .Values.onlyoffice.image }}
        imagePullPolicy: IfNotPresent
        env:
        - name: JWT_ENABLED
          value: "true"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: onlyoffice-credentials
              key: jwt-secret
        - name: PLUGINS_ENABLED
          value: "false"
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        startupProbe:
          httpGet:
            path: /healthcheck
            port: http
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          {{- toYaml .Values.onlyoffice.resources | nindent 10 }}
        # the image runs its services as root
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: onlyoffice
  labels:
    app: onlyoffice
    app.kubernetes.io/name: onlyoffice
    app.kubernetes.io/instance: onlyoffice
    app.kubernetes.io/component: office
    app.kubernetes.io/part-of: nextcloud-office
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: onlyoffice
    app.kubernetes.io/instance: onlyoffice
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: onlyoffice
  labels:
    app: onlyoffice
    app.kubernetes.io/name: onlyoffice
    app.kubernetes.io/instance: onlyoffice
    app.kubernetes.io/component: route
    app.kubernetes.io/part-of: nextcloud-office
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
  {{- with include "wrapper.routeAnnotations" (dict "root" .) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  host: {{ include "wrapper.onlyofficeHost" . }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: onlyoffice
    weight: 100
  wildcardPolicy: None
{{- end }}
