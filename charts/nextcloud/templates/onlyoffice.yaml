{{- if .Values.onlyoffice.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlyoffice
  annotations:
    app.openshift.io/custom-icon: https://avatars.githubusercontent.com/ONLYOFFICE
    app.openshift.io/vcs-uri: https://github.com/ONLYOFFICE/DocumentServer
  labels:
    app: onlyoffice
    app.kubernetes.io/name: onlyoffice
    app.kubernetes.io/instance: onlyoffice
    app.kubernetes.io/component: office
    app.kubernetes.io/part-of: nextcloud-office
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
    app.openshift.io/runtime: nodejs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: onlyoffice
      app.kubernetes.io/instance: onlyoffice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onlyoffice
        app.kubernetes.io/instance: onlyoffice
      {{- if .Values.onlyoffice.agentBridge.enabled }}
      annotations:
        checksum/agent-bridge: {{ (.Files.Glob "files/onlyoffice-agent-bridge/*").AsConfig | sha256sum }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      containers:
      - name: onlyoffice
        image: {{ .Values.onlyoffice.image }}
        imagePullPolicy: IfNotPresent
        env:
        - name: JWT_ENABLED
          value: "true"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: onlyoffice-credentials
              key: jwt-secret
        - name: PLUGINS_ENABLED
          value: "false"
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        startupProbe:
          httpGet:
            path: /healthcheck
            port: http
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          {{- toYaml .Values.onlyoffice.resources | nindent 10 }}
        # the image runs its services as root
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
        {{- if .Values.onlyoffice.agentBridge.enabled }}
        volumeMounts:
        - name: agent-bridge
          mountPath: /var/www/onlyoffice/documentserver/sdkjs-plugins/agent-bridge
          readOnly: true
      volumes:
      - name: agent-bridge
        configMap:
          name: onlyoffice-agent-bridge
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: onlyoffice
  labels:
    app: onlyoffice
    app.kubernetes.io/name: onlyoffice
    app.kubernetes.io/instance: onlyoffice
    app.kubernetes.io/component: office
    app.kubernetes.io/part-of: nextcloud-office
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: onlyoffice
    app.kubernetes.io/instance: onlyoffice
---
{{ include "wrapper.pathRoute" (dict "root" . "name" "office" "partOf" "nextcloud-office" "path" "/office" "service" "onlyoffice" "port" "http" "headers" (dict "X-Forwarded-Prefix" "/office")) }}
{{- end }}
