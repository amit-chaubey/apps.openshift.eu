apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nextcloud
  labels:
    app: nextcloud
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: route
    app.kubernetes.io/part-of: nextcloud
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
  {{- with include "wrapper.routeAnnotations" (dict "root" .) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  host: {{ include "wrapper.host" . }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: nextcloud
    weight: 100
  wildcardPolicy: None
