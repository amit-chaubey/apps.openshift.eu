{{- if eq .Values.secrets.type "externalSecret" }}
{{- $es := .Values.secrets.externalSecret }}
{{- $store := required "secrets.externalSecret.storeName is required" $es.storeName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-credentials
  labels:
    app: nextcloud
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: nextcloud
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ $store }}
  target:
    name: nextcloud-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        nextcloud-username: {{ .Values.secrets.adminUsername | quote }}
        mariadb-username: nextcloud
        smtp-host: {{ .Values.smtp.host | quote }}
  data:
  {{- range $key := list "nextcloud-password" "mariadb-password" "mariadb-root-password" }}
  - secretKey: {{ $key }}
    remoteRef:
      key: {{ index $es.items $key }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  {{- end }}
{{- if .Values.onlyoffice.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onlyoffice-credentials
  labels:
    app: onlyoffice
    app.kubernetes.io/name: onlyoffice
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: nextcloud-office
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ $store }}
  target:
    name: onlyoffice-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: jwt-secret
    remoteRef:
      key: {{ index $es.items "jwt-secret" }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- end }}
{{- end }}
{{- if and (eq .Values.secrets.type "kubernetes") .Values.secrets.generator.enabled }}
{{- $s := .Values.secrets }}
{{- $tpl := $s.generator.secretTemplate }}
{{- $values := dict "nextcloud-password" $s.adminPassword "mariadb-password" $s.mariadbPassword "mariadb-root-password" $s.mariadbRootPassword }}
{{- $lengths := dict "nextcloud-password" 24 "mariadb-password" 32 "mariadb-root-password" 32 }}
{{- range $key := list "nextcloud-password" "mariadb-password" "mariadb-root-password" }}
{{- if not (index $values $key) }}
---
# letters and digits only: the database password is used inside a URL
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: nextcloud-credentials-{{ $key }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app: nextcloud
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: nextcloud
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
spec:
  length: {{ index $lengths $key }}
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
{{- end }}
{{- end }}
---
# generated once; immutable, or a second reconcile at creation writes new passwords
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app: nextcloud
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: nextcloud
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: nextcloud-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    immutable: true
    template:
      engineVersion: v2
      metadata:
        labels:
          app: nextcloud
          app.kubernetes.io/name: nextcloud
          app.kubernetes.io/component: credentials
          app.kubernetes.io/part-of: nextcloud
          {{- include "nextcloud.commonLabels" $ | nindent 10 }}
          {{- with $tpl.labels }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- with $tpl.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      data:
        nextcloud-username: {{ $s.adminUsername | quote }}
        mariadb-username: nextcloud
        smtp-host: {{ .Values.smtp.host | quote }}
        {{- range $key := list "nextcloud-password" "mariadb-password" "mariadb-root-password" }}
        {{- if index $values $key }}
        {{ $key }}: {{ index $values $key | quote }}
        {{- else }}
        {{ $key }}: {{ printf "{{ index . %q }}" $key | quote }}
        {{- end }}
        {{- end }}
  dataFrom:
  {{- range $key := list "nextcloud-password" "mariadb-password" "mariadb-root-password" }}
  {{- if not (index $values $key) }}
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: nextcloud-credentials-{{ $key }}
    rewrite:
    - regexp:
        source: ^password$
        target: {{ $key }}
  {{- end }}
  {{- end }}
{{- end }}
