{{- if eq .Values.secrets.type "externalSecret" }}
{{- $es := .Values.secrets.externalSecret }}
{{- $store := required "secrets.externalSecret.storeName is required" $es.storeName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-credentials
  labels:
    {{- include "wrapper.objectLabels" (dict "root" $ "app" "nextcloud" "component" "credentials") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ $store }}
  target:
    name: nextcloud-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        nextcloud-username: {{ .Values.secrets.adminUsername | quote }}
        mariadb-username: nextcloud
        smtp-host: {{ .Values.smtp.host | quote }}
  data:
  {{- range $key := list "nextcloud-password" "mariadb-password" "mariadb-root-password" }}
  - secretKey: {{ $key }}
    remoteRef:
      key: {{ index $es.items $key }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  {{- end }}
{{- if .Values.onlyoffice.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onlyoffice-credentials
  labels:
    {{- include "wrapper.objectLabels" (dict "root" $ "app" "onlyoffice" "component" "credentials") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ $store }}
  target:
    name: onlyoffice-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: jwt-secret
    remoteRef:
      key: {{ index $es.items "jwt-secret" }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- end }}
{{- end }}
