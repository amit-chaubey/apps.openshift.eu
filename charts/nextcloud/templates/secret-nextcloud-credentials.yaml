{{- if eq .Values.secrets.type "kubernetes" }}
{{- $existing := include "wrapper.existingData" (dict "namespace" .Release.Namespace "name" "nextcloud-credentials") | fromJson }}
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-credentials
  labels:
    app: nextcloud
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: nextcloud
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  nextcloud-username: {{ .Values.secrets.adminUsername | b64enc | quote }}
  nextcloud-password: {{ include "wrapper.secretValue" (dict "value" .Values.secrets.adminPassword "existing" $existing "key" "nextcloud-password" "length" 24) | quote }}
  mariadb-username: {{ "nextcloud" | b64enc | quote }}
  mariadb-password: {{ include "wrapper.secretValue" (dict "value" .Values.secrets.mariadbPassword "existing" $existing "key" "mariadb-password" "length" 32) | quote }}
  mariadb-root-password: {{ include "wrapper.secretValue" (dict "value" .Values.secrets.mariadbRootPassword "existing" $existing "key" "mariadb-root-password" "length" 32) | quote }}
  smtp-host: {{ .Values.smtp.host | b64enc | quote }}
{{- if .Values.onlyoffice.enabled }}
{{- $office := include "wrapper.existingData" (dict "namespace" .Release.Namespace "name" "onlyoffice-credentials") | fromJson }}
---
apiVersion: v1
kind: Secret
metadata:
  name: onlyoffice-credentials
  labels:
    app: onlyoffice
    app.kubernetes.io/name: onlyoffice
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: nextcloud-office
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ include "wrapper.secretValue" (dict "value" .Values.secrets.onlyofficeJwtSecret "existing" $office "key" "jwt-secret" "length" 48) | quote }}
{{- end }}
{{- end }}
