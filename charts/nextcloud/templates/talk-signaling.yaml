{{- if .Values.talk.enabled }}
{{- $t := .Values.talk }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-nats
  {{- with include "wrapper.topologyAnnotations" "nextcloud-nats" }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "wrapper.labels" "nextcloud-nats" | nindent 4 }}
    {{- include "wrapper.topologyLabels" "nextcloud-nats" | nindent 4 }}
    {{- include "wrapper.objectLabels" (dict "root" $ "app" "nextcloud-nats" "component" "queue" "skip" (list "app.kubernetes.io/name" "app.kubernetes.io/part-of")) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "wrapper.labels" "nextcloud-nats" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wrapper.labels" "nextcloud-nats" | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: nats
        image: {{ $t.nats.image }}
        imagePullPolicy: IfNotPresent
        args: [-m, "8222"]
        ports:
        - name: client
          containerPort: 4222
          protocol: TCP
        - name: monitor
          containerPort: 8222
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: monitor
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: monitor
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml $t.nats.resources | nindent 10 }}
        securityContext:
          {{- include "wrapper.restricted" . | nindent 10 }}
      {{- if .Values.monitoring.enabled }}
      - name: metrics
        image: {{ .Values.monitoring.natsExporterImage }}
        imagePullPolicy: IfNotPresent
        args: [-varz, "http://localhost:8222"]
        ports:
        - name: metrics
          containerPort: 7777
          protocol: TCP
        resources:
          {{- toYaml .Values.monitoring.resources | nindent 10 }}
        securityContext:
          {{- include "wrapper.restricted" . | nindent 10 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-nats
  labels:
    {{- include "wrapper.labels" "nextcloud-nats" | nindent 4 }}
    {{- include "wrapper.objectLabels" (dict "root" $ "app" "nextcloud-nats" "component" "queue" "skip" (list "app.kubernetes.io/name")) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: client
    port: 4222
    targetPort: client
    protocol: TCP
  {{- if .Values.monitoring.enabled }}
  - name: metrics
    port: 7777
    targetPort: metrics
    protocol: TCP
  {{- end }}
  selector:
    {{- include "wrapper.labels" "nextcloud-nats" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-signaling
  labels:
    {{- include "wrapper.objectLabels" (dict "root" $ "app" "nextcloud-signaling" "component" "config") | nindent 4 }}
data:
  # the init container replaces the names in capitals by the secrets
  server.conf: |
    [http]
    listen = 0.0.0.0:8080

    [app]
    debug = false

    [sessions]
    hashkey = SIGNALING_HASHKEY
    blockkey = SIGNALING_BLOCKKEY

    [clients]
    internalsecret = SIGNALING_INTERNAL_SECRET

    [backend]
    backends = nextcloud

    [nextcloud]
    urls = https://{{ include "wrapper.host" . }}/
    secret = SIGNALING_SECRET

    [nats]
    url = nats://nextcloud-nats:4222

    [stats]
    allowed_ips = {{ $t.signaling.statsAllowedIps }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-signaling
  {{- with include "wrapper.topologyAnnotations" "nextcloud-signaling" }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "wrapper.labels" "nextcloud-signaling" | nindent 4 }}
    {{- include "wrapper.topologyLabels" "nextcloud-signaling" | nindent 4 }}
    {{- include "wrapper.objectLabels" (dict "root" $ "app" "nextcloud-signaling" "component" "signaling" "skip" (list "app.kubernetes.io/name" "app.kubernetes.io/part-of")) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "wrapper.labels" "nextcloud-signaling" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wrapper.labels" "nextcloud-signaling" | nindent 8 }}
      annotations:
        checksum/config: {{ toJson $t.signaling | sha256sum }}
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: config
        image: {{ $t.initImage }}
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          until nc -z nextcloud-nats 4222; do echo "waiting for NATS"; sleep 2; done
          sed -e "s|SIGNALING_HASHKEY|$HASHKEY|" -e "s|SIGNALING_BLOCKKEY|$BLOCKKEY|" \
            -e "s|SIGNALING_INTERNAL_SECRET|$INTERNAL|" -e "s|SIGNALING_SECRET|$SECRET|" \
            /template/server.conf > /config/server.conf
        env:
        - name: HASHKEY
          valueFrom:
            secretKeyRef:
              name: nextcloud-talk
              key: signaling-hashkey
        - name: BLOCKKEY
          valueFrom:
            secretKeyRef:
              name: nextcloud-talk
              key: signaling-blockkey
        - name: INTERNAL
          valueFrom:
            secretKeyRef:
              name: nextcloud-talk
              key: signaling-internal-secret
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: nextcloud-talk
              key: signaling-secret
        resources:
          {{- toYaml $t.signaling.resources | nindent 10 }}
        securityContext:
          {{- include "wrapper.restricted" . | nindent 10 }}
        volumeMounts:
        - name: template
          mountPath: /template
          readOnly: true
        - name: config
          mountPath: /config
      containers:
      - name: signaling
        image: {{ $t.signaling.image }}
        imagePullPolicy: IfNotPresent
        command: [/usr/bin/nextcloud-spreed-signaling]
        args: [-config, /config/server.conf]
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /api/v1/welcome
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/v1/welcome
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml $t.signaling.resources | nindent 10 }}
        securityContext:
          readOnlyRootFilesystem: true
          {{- include "wrapper.restricted" . | nindent 10 }}
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: template
        configMap:
          name: nextcloud-signaling
      - name: config
        emptyDir:
          medium: Memory
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-signaling
  labels:
    {{- include "wrapper.labels" "nextcloud-signaling" | nindent 4 }}
    {{- include "wrapper.objectLabels" (dict "root" $ "app" "nextcloud-signaling" "component" "signaling" "skip" (list "app.kubernetes.io/name")) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  selector:
    {{- include "wrapper.labels" "nextcloud-signaling" | nindent 4 }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nextcloud-signaling
  labels:
    {{- include "wrapper.labels" "nextcloud-signaling" | nindent 4 }}
    {{- include "wrapper.objectLabels" (dict "root" $ "app" "nextcloud-signaling" "component" "route" "skip" (list "app.kubernetes.io/name")) | nindent 4 }}
  annotations:
    {{- include "wrapper.routeAnnotations" (dict "root" .) | nindent 4 }}
spec:
  host: {{ include "wrapper.signalingHost" . }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: nextcloud-signaling
    weight: 100
  wildcardPolicy: None
{{- end }}
