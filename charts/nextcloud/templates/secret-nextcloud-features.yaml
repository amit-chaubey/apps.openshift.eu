{{- if eq .Values.secrets.type "kubernetes" }}
{{- $s := .Values.secrets }}
{{- $ns := .Release.Namespace }}
{{- if include "wrapper.cacheEnabled" . }}
{{- $e := include "wrapper.existingData" (dict "namespace" $ns "name" "nextcloud-redis") | fromJson }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-redis
  labels:
    app: nextcloud-redis
    app.kubernetes.io/name: nextcloud-redis
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: nextcloud
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  redis-host: {{ "nextcloud-redis" | b64enc | quote }}
  redis-password: {{ include "wrapper.secretValue" (dict "value" $s.redisPassword "existing" $e "key" "redis-password" "length" 32) | quote }}
{{- end }}
{{- if .Values.whiteboard.enabled }}
{{- $e := include "wrapper.existingData" (dict "namespace" $ns "name" "nextcloud-whiteboard") | fromJson }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-whiteboard
  labels:
    app: nextcloud-whiteboard
    app.kubernetes.io/name: nextcloud-whiteboard
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: nextcloud-office
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  whiteboard-jwt-secret: {{ include "wrapper.secretValue" (dict "value" $s.whiteboardJwtSecret "existing" $e "key" "whiteboard-jwt-secret" "length" 48) | quote }}
{{- end }}
{{- if .Values.talk.enabled }}
{{- $e := include "wrapper.existingData" (dict "namespace" $ns "name" "nextcloud-talk") | fromJson }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-talk
  labels:
    app: nextcloud-signaling
    app.kubernetes.io/name: nextcloud-signaling
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: nextcloud-talk
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  signaling-secret: {{ include "wrapper.secretValue" (dict "value" $s.signalingSecret "existing" $e "key" "signaling-secret" "length" 48) | quote }}
  signaling-internal-secret: {{ include "wrapper.secretValue" (dict "value" $s.signalingInternalSecret "existing" $e "key" "signaling-internal-secret" "length" 48) | quote }}
  signaling-hashkey: {{ include "wrapper.secretValue" (dict "value" $s.signalingHashKey "existing" $e "key" "signaling-hashkey" "length" 64) | quote }}
  signaling-blockkey: {{ include "wrapper.secretValue" (dict "value" $s.signalingBlockKey "existing" $e "key" "signaling-blockkey" "length" 32) | quote }}
  recording-secret: {{ include "wrapper.secretValue" (dict "value" $s.recordingSecret "existing" $e "key" "recording-secret" "length" 48) | quote }}
  turn-secret: {{ include "wrapper.secretValue" (dict "value" $s.turnSecret "existing" $e "key" "turn-secret" "length" 48) | quote }}
{{- end }}
{{- if .Values.ai.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-ai
  labels:
    app: nextcloud
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: nextcloud
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  ai-api-key: {{ required "secrets.aiApiKey is required when ai.enabled" $s.aiApiKey | b64enc | quote }}
{{- end }}
{{- if include "wrapper.oidcActive" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-oidc
  labels:
    app: nextcloud
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: nextcloud
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  oidc-client-secret: {{ required "secrets.oidcClientSecret is required when oidc is set up" $s.oidcClientSecret | b64enc | quote }}
{{- end }}
{{- if include "wrapper.mailLoginActive" . }}
{{- $e := include "wrapper.existingData" (dict "namespace" $ns "name" "nextcloud-mail-login") | fromJson }}
{{- $secret := include "wrapper.secretValue" (dict "value" $s.mailLoginSecret "existing" $e "key" "login-secret" "length" 48) }}
{{- $raw := b64dec $secret }}
{{- $header := printf "X-Mail-Login-%s" (sha256sum $raw | trunc 32) }}
{{- $front := printf "%s-front" (.Values.mailu.upstream.fullnameOverride | default "mailu") }}
{{- /* sso: oauth2-proxy expands the variables from Secret nextcloud-sso at start */ -}}
{{- $provider := dict "id" "oidc" "provider" "oidc" "scope" .Values.oidc.scope "code_challenge_method" "S256" }}
{{- if .Values.sso.enabled }}
{{- $_ := set $provider "clientID" "${SSO_CLIENT_ID}" }}
{{- $_ := set $provider "clientSecret" "${SSO_CLIENT_SECRET}" }}
{{- $_ := set $provider "oidcConfig" (dict "issuerURL" "${SSO_ISSUER_URL}" "emailClaim" "email" "audienceClaims" (list "aud")) }}
{{- else }}
{{- $_ := set $provider "clientID" .Values.oidc.clientId }}
{{- $_ := set $provider "clientSecretFile" "/etc/oidc/oidc-client-secret" }}
{{- $_ := set $provider "oidcConfig" (dict "issuerURL" (trimSuffix "/.well-known/openid-configuration" .Values.oidc.discoveryUri) "emailClaim" "email" "audienceClaims" (list "aud")) }}
{{- end }}
{{- $alpha := dict
  "server" (dict "bindAddress" "0.0.0.0:8080")
  "providers" (list $provider)
  "upstreamConfig" (dict "upstreams" (list (dict "id" "mailu" "path" "^/mail/login$" "rewriteTarget" "/mail/sso/login" "uri" (printf "http://%s:80" $front))))
  "injectRequestHeaders" (list (dict "name" $header "values" (list (dict "claimSource" (dict "claim" "email"))))) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-mail-login
  labels:
    app: nextcloud-mail-login
    app.kubernetes.io/name: nextcloud-mail-login
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: nextcloud-mail
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  login-secret: {{ $secret | quote }}
  # read by Mailu admin: the login header and the only address it is taken from (the front)
  header: {{ $header | b64enc | quote }}
  whitelist: {{ "127.0.0.1/32" | b64enc | quote }}
  # read by the login proxy
  cookie-secret: {{ sha256sum (printf "cookie %s" $raw) | trunc 32 | b64enc | quote }}
  alpha.yaml: {{ toYaml $alpha | b64enc | quote }}
{{- end }}
{{- if .Values.monitoring.enabled }}
{{- $e := include "wrapper.existingData" (dict "namespace" $ns "name" "nextcloud-metrics") | fromJson }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-metrics
  labels:
    app: nextcloud-exporter
    app.kubernetes.io/name: nextcloud-exporter
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: nextcloud-monitoring
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  metrics-token: {{ include "wrapper.secretValue" (dict "value" $s.metricsToken "existing" $e "key" "metrics-token" "length" 48) | quote }}
{{- end }}
{{- end }}
