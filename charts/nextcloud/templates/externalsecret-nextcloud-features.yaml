{{- if eq .Values.secrets.type "externalSecret" }}
{{- if include "wrapper.cacheEnabled" . }}
---
{{ include "wrapper.externalSecret" (dict "root" . "name" "nextcloud-redis" "app" "nextcloud-redis" "partOf" "nextcloud" "keys" (list "redis-password") "static" (dict "redis-host" "nextcloud-redis")) }}
{{- end }}
{{- if .Values.whiteboard.enabled }}
---
{{ include "wrapper.externalSecret" (dict "root" . "name" "nextcloud-whiteboard" "app" "nextcloud-whiteboard" "partOf" "nextcloud-office" "keys" (list "whiteboard-jwt-secret")) }}
{{- end }}
{{- if .Values.talk.enabled }}
---
{{ include "wrapper.externalSecret" (dict "root" . "name" "nextcloud-talk" "app" "nextcloud-signaling" "partOf" "nextcloud-talk" "keys" (list "signaling-secret" "signaling-internal-secret" "signaling-hashkey" "signaling-blockkey" "recording-secret" "turn-secret")) }}
{{- end }}
{{- if .Values.ai.enabled }}
---
{{ include "wrapper.externalSecret" (dict "root" . "name" "nextcloud-ai" "app" "nextcloud" "partOf" "nextcloud" "keys" (list "ai-api-key")) }}
{{- end }}
{{- if include "wrapper.oidcActive" . }}
---
{{ include "wrapper.externalSecret" (dict "root" . "name" "nextcloud-oidc" "app" "nextcloud" "partOf" "nextcloud" "keys" (list "oidc-client-secret")) }}
{{- end }}
{{- if .Values.monitoring.enabled }}
---
{{ include "wrapper.externalSecret" (dict "root" . "name" "nextcloud-metrics" "app" "nextcloud-exporter" "partOf" "nextcloud-monitoring" "keys" (list "metrics-token")) }}
{{- end }}
{{- end }}
